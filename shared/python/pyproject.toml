[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-playground"
version = "0.1.0"
description = "Tiny teaching client for the ELO IX REST API (Python)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.setuptools]
packages = ["elo_playground"]
