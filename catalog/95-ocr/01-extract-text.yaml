id: ocr.extract
order: 1
attach_file: true
category:
  en: OCR & text extraction
  de: OCR & Textextraktion
  es: OCR y extracción de texto
title:
  en: OCR a file and show the recognised text
  de: Eine Datei per OCR erkennen und den Text anzeigen
  es: Aplicar OCR a un archivo y mostrar el texto reconocido
summary:
  en: >
    `processOcr` hands a file to ELO's OCR engine (the "Textreader") and returns
    the recognised text. Send the bytes in `ocrInfo.recognizeFile.imageData`
    ({ data: base64, contentType }); set `outputFormat` 0 (OcrInfoC.TEXT) for
    plain text. The text comes back in `recognizeFile.text`; `recognizeFile` is
    absent and `exception` is set on failure. Use **Choose file** to send a real
    scan (`examples/invoices/` has some - run
    `python scripts/make_sample_invoices.py`); with no file picked, a small
    built-in invoice is sent so the snippet is self-contained. NOTE: needs the
    ELO OCR / Textreader module; without it the call fails with
    `[ELOIX:10] ... Unknown ticket`.
  de: "`processOcr` übergibt eine Datei an die OCR-Engine von ELO (den „Textreader“) und liefert den erkannten Text. Die Bytes in `ocrInfo.recognizeFile.imageData` senden ({ data: base64, contentType }); `outputFormat` 0 (OcrInfoC.TEXT) für reinen Text setzen. Der Text steht in `recognizeFile.text`; bei einem Fehler fehlt `recognizeFile` und `exception` ist gesetzt. Mit **Datei wählen** einen echten Scan senden (`examples/invoices/` enthält welche - `python scripts/make_sample_invoices.py` ausführen); ohne gewählte Datei wird eine kleine eingebaute Rechnung gesendet, damit das Snippet eigenständig ist. HINWEIS: benötigt das ELO-OCR-/Textreader-Modul; ohne dieses schlägt der Aufruf mit `[ELOIX:10] ... Unknown ticket` fehl."
  es: "`processOcr` entrega un archivo al motor OCR de ELO (el «Textreader») y devuelve el texto reconocido. Enviá los bytes en `ocrInfo.recognizeFile.imageData` ({ data: base64, contentType }); poné `outputFormat` 0 (OcrInfoC.TEXT) para texto plano. El texto vuelve en `recognizeFile.text`; ante un fallo falta `recognizeFile` y `exception` queda seteado. Usá **Elegir archivo** para enviar un escaneo real (`examples/invoices/` tiene algunos - ejecutá `python scripts/make_sample_invoices.py`); si no elegís archivo, se envía una pequeña factura interna para que el snippet sea autónomo. NOTA: necesita el módulo OCR / Textreader de ELO; sin él la llamada falla con `[ELOIX:10] ... Unknown ticket`."

elo_api:
  - method: processOcr
    rpc: POST /rest/IXServicePortIF/processOcr
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/processOcr
    notes:
      en: 'ocrInfo.recognizeFile: imageData {data: base64, contentType} OR objId; outputFormat 0 = TEXT; pageNo -1 = all pages.'
      de: 'ocrInfo.recognizeFile: imageData {data: base64, contentType} ODER objId; outputFormat 0 = TEXT; pageNo -1 = alle Seiten.'
      es: 'ocrInfo.recognizeFile: imageData {data: base64, contentType} O objId; outputFormat 0 = TEXT; pageNo -1 = todas las páginas.'

result_shape: |
  sending invoice.txt  (76 bytes, contentType=txt)
  --- recognised text ---
  INVOICE 2026-0042
  Acme GmbH
  Net:   1,234.56 EUR
  VAT 19%: 234.57 EUR
  Total: 1,469.13 EUR

snippets:
  python: |
    import base64
    import os
    from elo_playground import connect, EloError, attachment

    # --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    ELO_BASE_URL = os.getenv("ELOPG_ELO_BASE_URL", "http://localhost:9090/ix-Repository1") # ELOPG_DEFAULT:base_url
    ELO_USER = os.getenv("ELOPG_ELO_USER", "Administrator") # ELOPG_DEFAULT:user
    ELO_PASS = os.getenv("ELOPG_ELO_PASSWORD", "elo") # ELOPG_DEFAULT:password

    elo = connect(base_url=ELO_BASE_URL, user=ELO_USER, password=ELO_PASS)

    # "Choose file" above picks a real scan; without it a tiny built-in invoice
    # is sent so the snippet is self-contained.
    picked = attachment()
    if picked:
        name, data = picked
        ext = name.rsplit(".", 1)[-1].lower() if "." in name else "txt"
    else:
        name, ext = "invoice.txt", "txt"
        data = (
            "INVOICE 2026-0042\n"
            "Acme GmbH\n"
            "Net:   1,234.56 EUR\n"
            "VAT 19%: 234.57 EUR\n"
            "Total: 1,469.13 EUR\n"
        ).encode("utf-8")
    print(f"sending {name}  ({len(data)} bytes, contentType={ext})")

    try:
        res = elo.call("processOcr", {"ocrInfo": {
            "recognizeFile": {
                "imageData": {"data": base64.b64encode(data).decode("ascii"), "contentType": ext},
                "outputFormat": 0,               # OcrInfoC.TEXT
                "pageNo": -1,                     # -1 = every page
            },
        }})
    except EloError as exc:
        # e.g. "[ELOIX:10] ... Unknown ticket" when the OCR module is not running
        print("OCR call failed:", exc)
    else:
        rf = res.get("recognizeFile")
        if not rf or res.get("exception"):
            print("OCR returned no text:", res.get("exception") or "(empty result)")
        else:
            print("--- recognised text ---")
            print((rf.get("text") or "").strip())
    finally:
        elo.close()

  node: |
    import { connect, EloError, attachment } from "elo-playground";

    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = process.env.ELOPG_ELO_BASE_URL || "http://localhost:9090/ix-Repository1"; // ELOPG_DEFAULT:base_url
    const ELO_USER = process.env.ELOPG_ELO_USER || "Administrator"; // ELOPG_DEFAULT:user
    const ELO_PASS = process.env.ELOPG_ELO_PASSWORD || "elo"; // ELOPG_DEFAULT:password

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });

    // "Choose file" above picks a real scan; without it a tiny built-in invoice
    // is sent so the snippet is self-contained.
    const picked = attachment();
    let name;
    let ext;
    let data;
    if (picked) {
      name = picked.name;
      ext = name.includes(".") ? name.split(".").pop().toLowerCase() : "txt";
      data = Buffer.from(picked.bytes);
    } else {
      name = "invoice.txt";
      ext = "txt";
      data = Buffer.from(
        "INVOICE 2026-0042\nAcme GmbH\nNet:   1,234.56 EUR\nVAT 19%: 234.57 EUR\nTotal: 1,469.13 EUR\n",
        "utf-8"
      );
    }
    console.log(`sending ${name}  (${data.length} bytes, contentType=${ext})`);

    try {
      const res = await elo.call("processOcr", {
        ocrInfo: {
          recognizeFile: {
            imageData: { data: data.toString("base64"), contentType: ext },
            outputFormat: 0, // OcrInfoC.TEXT
            pageNo: -1, // every page
          },
        },
      });
      const rf = res.recognizeFile;
      if (!rf || res.exception) {
        console.log("OCR returned no text:", res.exception || "(empty result)");
      } else {
        console.log("--- recognised text ---");
        console.log((rf.text || "").trim());
      }
    } catch (exc) {
      if (exc instanceof EloError) console.log("OCR call failed:", exc.message);
      else throw exc;
    } finally {
      elo.close();
    }

  browser: |
    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = globalThis.ELOPG_ELO_BASE_URL || "http://localhost:9090/ix-Repository1"; // ELOPG_DEFAULT:base_url
    const ELO_USER = globalThis.ELOPG_ELO_USER || "Administrator"; // ELOPG_DEFAULT:user
    const ELO_PASS = globalThis.ELOPG_ELO_PASSWORD || "elo"; // ELOPG_DEFAULT:password

    // base64 of a Uint8Array (btoa needs a binary string)
    const toB64 = (u8) => {
      let s = "";
      for (const b of u8) s += String.fromCharCode(b);
      return btoa(s);
    };

    // "Choose file" above picks a real scan; without it a tiny built-in invoice
    // is sent so the snippet is self-contained.
    const picked = attachment();
    let name;
    let ext;
    let b64;
    if (picked) {
      name = picked.name;
      ext = name.includes(".") ? name.split(".").pop().toLowerCase() : "txt";
      b64 = toB64(picked.bytes);
    } else {
      name = "invoice.txt";
      ext = "txt";
      b64 = toB64(
        new TextEncoder().encode(
          "INVOICE 2026-0042\nAcme GmbH\nNet:   1,234.56 EUR\nVAT 19%: 234.57 EUR\nTotal: 1,469.13 EUR\n"
        )
      );
    }
    console.log(`sending ${name}  (contentType=${ext})`);

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });
    try {
      const res = await elo.call("processOcr", {
        ocrInfo: {
          recognizeFile: { imageData: { data: b64, contentType: ext }, outputFormat: 0, pageNo: -1 },
        },
      });
      const rf = res.recognizeFile;
      if (!rf || res.exception) console.log("OCR returned no text:", res.exception || "(empty)");
      else {
        console.log("--- recognised text ---");
        console.log((rf.text || "").trim());
      }
    } catch (exc) {
      console.log("OCR call failed:", exc.message);
    }

