id: ocr.archived
order: 2
category:
  en: OCR & text extraction
  de: OCR & Textextraktion
  es: OCR y extracción de texto
title:
  en: Get the text of a document that is in the archive
  de: Den Text eines archivierten Dokuments holen
  es: Obtener el texto de un documento archivado
summary:
  en: >
    Given an object id, two ways to get its text. (1) `processOcr` with
    `recognizeFile.objId` runs OCR on it now - the engine fetches the file
    itself. (2) `checkoutDoc` (with `editInfoZ.bset` "320") returns
    `document.docs[0].fulltextContent` - the text the fulltext pipeline already
    extracted at import time (read-only, no re-OCR, present only once the
    document has been indexed). The snippet uploads its own throwaway text
    document and deletes it. NOTE: (1) needs the OCR module, (2) needs the
    iSearch / Elasticsearch index - without them you get an empty result or
    `[ELOIX:10] ... Unknown ticket`, which the snippet catches.
  de: "Bei gegebener Objekt-ID zwei Wege zum Text. (1) `processOcr` mit `recognizeFile.objId` führt jetzt OCR aus - die Engine holt die Datei selbst. (2) `checkoutDoc` (mit `editInfoZ.bset` „320“) liefert `document.docs[0].fulltextContent` - den beim Import bereits extrahierten Text (schreibgeschützt, kein erneutes OCR, nur vorhanden, wenn das Dokument indexiert wurde). Das Snippet lädt sein eigenes Wegwerf-Textdokument hoch und löscht es. HINWEIS: (1) benötigt das OCR-Modul, (2) den iSearch-/Elasticsearch-Index - ohne diese gibt es ein leeres Ergebnis oder `[ELOIX:10] ... Unknown ticket`, was das Snippet abfängt."
  es: "Dado un id de objeto, dos formas de obtener su texto. (1) `processOcr` con `recognizeFile.objId` corre OCR ahora - el motor obtiene el archivo por sí mismo. (2) `checkoutDoc` (con `editInfoZ.bset` «320») devuelve `document.docs[0].fulltextContent` - el texto que el pipeline de fulltext ya extrajo al importar (solo lectura, sin re-OCR, presente solo una vez indexado el documento). El snippet sube su propio documento de texto desechable y lo borra. NOTA: (1) necesita el módulo OCR, (2) el índice iSearch / Elasticsearch - sin ellos obtenés un resultado vacío o `[ELOIX:10] ... Unknown ticket`, que el snippet captura."

elo_api:
  - method: checkinDocBegin
    rpc: POST /rest/IXServicePortIF/checkinDocBegin
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkinDocBegin
    notes:
      en: 'Part of the upload (see Repository -> Upload and download) that provisions the throwaway document.'
      de: 'Teil des Uploads (siehe Archiv -> Hoch- und Herunterladen), der das Wegwerf-Dokument anlegt.'
      es: 'Parte de la subida (ver Repositorio -> Subir y descargar) que crea el documento desechable.'
  - method: processOcr
    rpc: POST /rest/IXServicePortIF/processOcr
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/processOcr
    notes:
      en: 'recognizeFile.objId points at the archived document; the engine fetches the file itself.'
      de: 'recognizeFile.objId verweist auf das archivierte Dokument; die Engine holt die Datei selbst.'
      es: 'recognizeFile.objId apunta al documento archivado; el motor obtiene el archivo por sí mismo.'
  - method: checkoutDoc
    rpc: POST /rest/IXServicePortIF/checkoutDoc
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkoutDoc
    notes:
      en: 'editInfoZ.bset "320" -> document.docs[0], whose fulltextContent (a FileData) carries the extracted text.'
      de: 'editInfoZ.bset "320" -> document.docs[0], dessen fulltextContent (ein FileData) den extrahierten Text trägt.'
      es: 'editInfoZ.bset "320" -> document.docs[0], cuyo fulltextContent (un FileData) lleva el texto extraído.'

result_shape: |
  uploaded doc 5001
  OCR text (first 120): INVOICE 2026-0042 Acme GmbH Total: 1,469.13 EUR
  fulltext index text : (not indexed on this archive)
  cleaned up

snippets:
  python: |
    from elo_playground import connect, EloError

    elo = connect()
    ALL = "449304431574384639"

    # --- provision: upload a throwaway text document ---
    body = b"INVOICE 2026-0042\nAcme GmbH\nTotal: 1,469.13 EUR\n"
    sord = elo.call("createDoc", {"parentId": 1, "maskId": 0,
                                  "editInfoZ": {"bset": "1", "sordZ": {"bset": ALL}}})["sord"]
    sord["name"] = "pg-ocr-doc.txt"
    doc = elo.call("checkinDocBegin", {"sord": sord, "document": {"docs": [{"ext": "txt"}]}})
    doc["docs"][0]["uploadResult"] = elo.upload(doc["docs"][0]["url"], body)
    obj_id = str(elo.call("checkinDocEnd", {"sord": sord, "document": doc,
                                            "sordZ": {"bset": ALL}, "unlockZ": {"bset": "1"}})["objId"])
    print("uploaded doc", obj_id)

    try:
        # 1) OCR it now
        try:
            ocr = elo.call("processOcr", {"ocrInfo": {
                "recognizeFile": {"objId": obj_id, "outputFormat": 0, "pageNo": -1},
            }})
            text = " ".join(((ocr.get("recognizeFile") or {}).get("text") or "").split())
            print("OCR text (first 120):", text[:120] or "(empty)")
        except EloError as exc:
            print("processOcr failed:", exc)

        # 2) or read the already-extracted fulltext
        info = elo.call("checkoutDoc", {"objId": obj_id,
                                        "editInfoZ": {"bset": "320", "sordZ": {"bset": "0"}}})
        docs = ((info.get("document") or {}).get("docs")) or []
        ftc = docs[0].get("fulltextContent") if docs else None
        print("fulltext index text :",
              (ftc.get("data") if isinstance(ftc, dict) else None) or "(not indexed on this archive)")
    finally:
        for step in (False, True):
            try:
                elo.call("deleteSord", {"objId": obj_id, "parentId": "1",
                                        "deleteOptions": {"deleteFinally": step}})
            except EloError:
                pass
        print("cleaned up")
        elo.close()

  node: |
    import { connect, EloError } from "elo-playground";

    const elo = await connect();
    const ALL = "449304431574384639";

    // --- provision: upload a throwaway text document ---
    const body = Buffer.from("INVOICE 2026-0042\nAcme GmbH\nTotal: 1,469.13 EUR\n", "utf-8");
    const sord = (await elo.call("createDoc", {
      parentId: 1, maskId: 0, editInfoZ: { bset: "1", sordZ: { bset: ALL } },
    })).sord;
    sord.name = "pg-ocr-doc.txt";
    const doc = await elo.call("checkinDocBegin", { sord, document: { docs: [{ ext: "txt" }] } });
    doc.docs[0].uploadResult = await elo.upload(doc.docs[0].url, body);
    const objId = String((await elo.call("checkinDocEnd", {
      sord, document: doc, sordZ: { bset: ALL }, unlockZ: { bset: "1" },
    })).objId);
    console.log("uploaded doc", objId);

    try {
      // 1) OCR it now
      try {
        const ocr = await elo.call("processOcr", {
          ocrInfo: { recognizeFile: { objId, outputFormat: 0, pageNo: -1 } },
        });
        const text = (((ocr.recognizeFile || {}).text) || "").split(/\s+/).join(" ").trim();
        console.log("OCR text (first 120):", text.slice(0, 120) || "(empty)");
      } catch (exc) {
        if (exc instanceof EloError) console.log("processOcr failed:", exc.message);
        else throw exc;
      }

      // 2) or read the already-extracted fulltext
      const info = await elo.call("checkoutDoc", {
        objId, editInfoZ: { bset: "320", sordZ: { bset: "0" } },
      });
      const docs = ((info.document || {}).docs) || [];
      const ftc = docs.length ? docs[0].fulltextContent : null;
      console.log(
        "fulltext index text :",
        (ftc && typeof ftc === "object" ? ftc.data : null) || "(not indexed on this archive)"
      );
    } finally {
      for (const step of [false, true]) {
        try {
          await elo.call("deleteSord", { objId, parentId: "1", deleteOptions: { deleteFinally: step } });
        } catch (e) { /* best effort */ }
      }
      console.log("cleaned up");
      elo.close();
    }

  browser: |
    // Uploading a document is not available from the browser (the connector is
    // on another origin). Run this one from the Python or Node tab; the browser
    // client would throw on elo.upload().
    const elo = await connect();
    try {
      const ocr = await elo.call("processOcr", {
        ocrInfo: { recognizeFile: { objId: "5001", outputFormat: 0, pageNo: -1 } },
      });
      const text = (((ocr.recognizeFile || {}).text) || "").split(/\s+/).join(" ").trim();
      console.log("OCR text (first 120):", text.slice(0, 120) || "(empty)");
    } catch (exc) {
      console.log("processOcr failed:", exc.message);
    }

mock:
  createDoc:
    sord: { id: 0, name: "", parentId: 1 }
  checkinDocBegin:
    docs:
      - { url: "mock://writedoc/1", ext: "txt" }
  checkinDocEnd:
    objId: 5001
    docs: [{ url: "mock://readdoc/1" }]
  processOcr:
    recognizeFile:
      text: "INVOICE 2026-0042\nAcme GmbH\nTotal: 1,469.13 EUR\n"
  checkoutDoc:
    document:
      docs:
        - { fulltextContent: null }
  deleteSord: {}
