title:
  en: Browse folders and preview the newest files
  de: Ordner durchsuchen und die neuesten Dateien ansehen
  es: Navegar carpetas y ver los archivos más recientes
summary:
  en: >
    Live only, read-only. The left side is the ELO folder tree; pick a folder
    and the right side lists the 50 most recently modified documents in it
    or anywhere below it (name, path, date, size), newest first. Click a
    file to open it in a viewer: code and text with syntax highlighting
    (.js, .json, .xml, .css, .csv, .txt, .md, .properties, ...), the text
    inside a .docx, PDFs and images in the browser's own viewer. There is no
    cheap "recursive children, newest first" query in IX - `findChildren`
    with `endLevel: -1` walks the subtree server-side (10-30 s on a mid-size
    repository) and `FindOptions.sortOrder` does not sort by date - so the
    panel uses what *is* fast: the indexed `findByIndex.iDateIso` range
    search (`"20260901000000...20260916000000"`, ~1200 rows/s with a lean
    `sordZ`), walked backwards through date windows (1, 3, 7, 14, 30 ... days)
    and filtered by `refPaths` (the folder ids on the way down; needs
    `sordZ` bit 59, which `mbAllIndex` does not include). A window is scanned
    whole before the next older one, so the list is exact unless the scan
    budget runs out inside a window - then the panel says so. `docVersion`
    (extension, size) needs bit 54. Content comes from `checkoutDoc` (a
    download URL on the same session).
  de: "Nur live, nur lesend. Links der ELO-Ordnerbaum; einen Ordner wählen, und rechts erscheinen die 50 zuletzt geänderten Dokumente darin oder irgendwo darunter (Name, Pfad, Datum, Größe), neueste zuerst. Ein Klick auf eine Datei öffnet sie in einem Viewer: Code und Text mit Syntaxhervorhebung (.js, .json, .xml, .css, .csv, .txt, .md, .properties, ...), der Text einer .docx, PDFs und Bilder im Viewer des Browsers. IX kennt keine günstige Abfrage \"rekursive Kinder, neueste zuerst\" - `findChildren` mit `endLevel: -1` läuft serverseitig durch den Teilbaum (10-30 s bei einem mittelgroßen Repository) und `FindOptions.sortOrder` sortiert nicht nach Datum -, daher nutzt das Panel, was schnell ist: die indizierte Bereichssuche `findByIndex.iDateIso` (`\"20260901000000...20260916000000\"`, ~1200 Zeilen/s mit schlankem `sordZ`), rückwärts durch Zeitfenster (1, 3, 7, 14, 30 ... Tage) und gefiltert über `refPaths` (die Ordner-IDs auf dem Weg nach unten; braucht `sordZ`-Bit 59, das in `mbAllIndex` fehlt). Ein Fenster wird komplett gelesen, bevor das nächste ältere drankommt - die Liste ist also exakt, außer das Budget geht innerhalb eines Fensters aus; dann sagt das Panel das. `docVersion` (Erweiterung, Größe) braucht Bit 54. Der Inhalt kommt per `checkoutDoc` (Download-URL in derselben Sitzung)."
  es: "Solo en vivo, solo lectura. A la izquierda el árbol de carpetas de ELO; elegís una carpeta y a la derecha aparecen los 50 documentos modificados más recientemente en ella o en cualquier subcarpeta (nombre, ruta, fecha, tamaño), del más nuevo al más viejo. Un clic en un archivo lo abre en un visor: código y texto con resaltado de sintaxis (.js, .json, .xml, .css, .csv, .txt, .md, .properties, ...), el texto de un .docx, PDF e imágenes en el visor del propio navegador. IX no tiene una consulta barata de \"hijos recursivos, más nuevos primero\" - `findChildren` con `endLevel: -1` recorre el subárbol en el servidor (10-30 s en un repositorio mediano) y `FindOptions.sortOrder` no ordena por fecha -, así que el panel usa lo que sí es rápido: la búsqueda indexada por rango `findByIndex.iDateIso` (`\"20260901000000...20260916000000\"`, ~1200 filas/s con un `sordZ` reducido), recorrida hacia atrás por ventanas de tiempo (1, 3, 7, 14, 30 ... días) y filtrada por `refPaths` (los ids de carpeta del camino hacia abajo; requiere el bit 59 de `sordZ`, que `mbAllIndex` no incluye). Cada ventana se lee completa antes de pasar a la anterior, así que la lista es exacta salvo que el presupuesto de lectura se agote dentro de una ventana - y entonces el panel lo dice. `docVersion` (extensión, tamaño) requiere el bit 54. El contenido viene de `checkoutDoc` (URL de descarga en la misma sesión)."

elo_api:
- method: findFirstSords
  rpc: POST /rest/IXServicePortIF/findFirstSords
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/findFirstSords
  notes:
    en: '`findByIndex: {iDateIso: "A...B"}` is an indexed range on the modification date; `findByType: {typeDocuments: true}` keeps documents only (`typeDocumentsOnly` is ignored here). `sordZ.bset` = 5 name, 7 IDateIso, 17 ownerName, 54 docVersion, 59 refPaths.'
    de: '`findByIndex: {iDateIso: "A...B"}` ist ein indizierter Bereich auf dem Änderungsdatum; `findByType: {typeDocuments: true}` behält nur Dokumente (`typeDocumentsOnly` wird hier ignoriert). `sordZ.bset` = 5 name, 7 IDateIso, 17 ownerName, 54 docVersion, 59 refPaths.'
    es: '`findByIndex: {iDateIso: "A...B"}` es un rango indexado sobre la fecha de modificación; `findByType: {typeDocuments: true}` deja solo documentos (`typeDocumentsOnly` se ignora acá). `sordZ.bset` = 5 name, 7 IDateIso, 17 ownerName, 54 docVersion, 59 refPaths.'
- method: findNextSords
  rpc: POST /rest/IXServicePortIF/findNextSords
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/findNextSords
  notes:
    en: 'Pages of 500 with `{searchId, idx, max, sordZ}` until `moreResults` is false; `findClose` releases the search.'
    de: 'Seiten zu 500 mit `{searchId, idx, max, sordZ}` bis `moreResults` false ist; `findClose` gibt die Suche frei.'
    es: 'Páginas de 500 con `{searchId, idx, max, sordZ}` hasta que `moreResults` sea false; `findClose` libera la búsqueda.'
- method: checkoutDoc
  rpc: POST /rest/IXServicePortIF/checkoutDoc
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/checkoutDoc
  notes:
    en: '`document.docs[0].url` is a download URL valid on the same session (`editInfoZ.bset: "320"`); the client GETs it. Same call as "Upload and download a document".'
    de: '`document.docs[0].url` ist eine Download-URL für dieselbe Sitzung (`editInfoZ.bset: "320"`); der Client lädt sie per GET. Derselbe Aufruf wie in "Dokument hoch- und herunterladen".'
    es: '`document.docs[0].url` es una URL de descarga válida en la misma sesión (`editInfoZ.bset: "320"`); el cliente la pide con GET. La misma llamada que en "Subir y descargar un documento".'

