title:
  en: Create a public share link for a document
  de: Einen öffentlichen Freigabe-Link für ein Dokument erstellen
  es: Crear un enlace público para compartir un documento
summary:
  en: >
    `insertPublicDownload` mints a tokenised download URL for a document that
    anyone can use, without an ELO login. Pass `opts.objId` and optionally
    `remaining` (a download budget), `expiration`, `fileNameFromSordName` and
    `contentDispositionAttachment`. It returns a `PublicDownload`
    ({ id, url, fileName, remaining, ... }). `getPublicDownloads` lists the
    links for an object; `terminatePublicDownloadUrls` revokes them (by
    `opts.objId` for all of an object's, or `opts.downloadIds` for specific
    ones). The URL points at the document connector (`:9093`). The snippet
    uploads its own throwaway document and removes it. This WRITES.
    (Verified live.)
  de: "`insertPublicDownload` erzeugt eine tokenisierte Download-URL für ein Dokument, die jeder ohne ELO-Anmeldung nutzen kann. `opts.objId` übergeben und optional `remaining` (ein Download-Budget), `expiration`, `fileNameFromSordName` und `contentDispositionAttachment`. Zurück kommt ein `PublicDownload` ({ id, url, fileName, remaining, ... }). `getPublicDownloads` listet die Links eines Objekts; `terminatePublicDownloadUrls` widerruft sie (über `opts.objId` für alle eines Objekts oder `opts.downloadIds` für einzelne). Die URL zeigt auf den Dokument-Connector (`:9093`). Das Snippet lädt sein eigenes Wegwerf-Dokument hoch und entfernt es. Das SCHREIBT. (Live bestätigt.)"
  es: "`insertPublicDownload` genera una URL de descarga con token para un documento que cualquiera puede usar, sin iniciar sesión en ELO. Se pasa `opts.objId` y opcionalmente `remaining` (un presupuesto de descargas), `expiration`, `fileNameFromSordName` y `contentDispositionAttachment`. Devuelve un `PublicDownload` ({ id, url, fileName, remaining, ... }). `getPublicDownloads` lista los enlaces de un objeto; `terminatePublicDownloadUrls` los revoca (por `opts.objId` todos los de un objeto, o `opts.downloadIds` los puntuales). La URL apunta al conector de documentos (`:9093`). El snippet sube su propio documento desechable y lo elimina. Esto ESCRIBE. (Verificado en vivo.)"

elo_api:
  - method: insertPublicDownload
    rpc: POST /rest/IXServicePortIF/insertPublicDownload
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/insertPublicDownload
    notes:
      en: 'Body { opts: { objId, remaining?, expiration?, fileNameFromSordName?, contentDispositionAttachment? } }. Returns a PublicDownload with a .url.'
      de: 'Body { opts: { objId, remaining?, expiration?, fileNameFromSordName?, contentDispositionAttachment? } }. Liefert ein PublicDownload mit .url.'
      es: 'Cuerpo { opts: { objId, remaining?, expiration?, fileNameFromSordName?, contentDispositionAttachment? } }. Devuelve un PublicDownload con .url.'
  - method: getPublicDownloads
    rpc: POST /rest/IXServicePortIF/getPublicDownloads
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/getPublicDownloads
    notes:
      en: 'Body { opts: { objId } } -> [PublicDownload]. Empty opts lists every public download you can see.'
      de: 'Body { opts: { objId } } -> [PublicDownload]. Leere opts listet alle sichtbaren öffentlichen Downloads.'
      es: 'Cuerpo { opts: { objId } } -> [PublicDownload]. opts vacío lista todas las descargas públicas visibles.'
  - method: terminatePublicDownloadUrls
    rpc: POST /rest/IXServicePortIF/terminatePublicDownloadUrls
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/terminatePublicDownloadUrls
    notes:
      en: 'Body { opts: { objId } } revokes all of an object''s links; { opts: { downloadIds: [id] } } revokes specific ones.'
      de: 'Body { opts: { objId } } widerruft alle Links eines Objekts; { opts: { downloadIds: [id] } } widerruft einzelne.'
      es: 'Cuerpo { opts: { objId } } revoca todos los enlaces de un objeto; { opts: { downloadIds: [id] } } revoca los puntuales.'

