title:
  en: "Generate an ELO structure on the local filesystem (and back)"
  de: "Eine ELO-Struktur im lokalen Dateisystem erzeugen (und zurück)"
  es: "Generar una estructura de ELO en el sistema de archivos local (y viceversa)"
summary:
  en: >
    An interactive panel (live mode only). Expand the ELO folder tree, pick a
    folder, and press Mirror: the selected folder is recreated inside
    `sandbox/elo-archiv-structure/` (that directory is emptied first) with its
    whole recursive content - every subfolder AND every document's bytes - and
    opened in your file manager. The reverse direction takes a local folder - a
    path on the backend host or one picked with the browser directory button -
    and recreates the whole tree (the folder itself, its subfolders and every
    document) under a chosen ELO folder. On export every folder also gets a
    `metadata.opf` (XML) holding its mask, GRP and MAP field values, dates and
    ACL - a backup / import template; on import that file is applied to the new
    ELO folder and is not itself uploaded as a document.
    Reading a level is `findFirstSords` + `findChildren`; a document's bytes come
    from `checkoutDoc` then a `download`; writing is `createSord`/`checkinSord`
    for folders and `createDoc` -> `checkinDocBegin` -> upload -> `checkinDocEnd`
    for files. Everything is capped (objects and per-file size) and every ELO
    error is caught so one bad document does not abort the run.
  de: >
    Ein interaktives Panel (nur Live-Modus). Den ELO-Ordnerbaum aufklappen,
    einen Ordner wählen und auf Spiegeln drücken: der gewählte Ordner wird in
    `sandbox/elo-archiv-structure/` nachgebaut (dieser Ordner wird zuvor
    geleert) - mit seinem gesamten rekursiven Inhalt, jedem Unterordner UND den
    Bytes jedes Dokuments - und im Dateimanager geöffnet. Die Gegenrichtung
    nimmt einen lokalen Ordner - einen Pfad auf dem Backend oder einen über die
    Browser-Verzeichnisauswahl gewählten - und baut den gesamten Baum (den
    Ordner selbst, seine Unterordner und jedes Dokument) unter einem gewählten
    ELO-Ordner nach. Beim Export erhält jeder Ordner zusätzlich eine
    `metadata.opf` (XML) mit Maske, GRP- und MAP-Feldwerten, Daten und ACL -
    eine Sicherung / Importvorlage; beim Import wird diese Datei auf den neuen
    ELO-Ordner angewendet und selbst nicht als Dokument hochgeladen. Eine Ebene lesen ist
    `findFirstSords` + `findChildren`; die Bytes eines Dokuments liefert
    `checkoutDoc` und danach ein `download`; geschrieben wird mit
    `createSord`/`checkinSord` für Ordner und `createDoc` -> `checkinDocBegin`
    -> Upload -> `checkinDocEnd` für Dateien. Alles ist begrenzt (Objektzahl und
    Größe pro Datei) und jeder ELO-Fehler wird abgefangen, damit ein defektes
    Dokument den Lauf nicht abbricht.
  es: >
    Un panel interactivo (solo en modo en vivo). Desplegá el árbol de carpetas
    de ELO, elegí una carpeta y pulsá Espejar: la carpeta seleccionada se
    recrea dentro de `sandbox/elo-archiv-structure/` (ese directorio se vacía
    primero) con todo su contenido recursivo - cada subcarpeta Y los bytes de
    cada documento - y se abre en tu explorador de archivos. El sentido inverso
    toma una carpeta local - una ruta en el backend o una elegida con el botón
    de directorio del navegador - y recrea todo el árbol (la carpeta misma, sus
    subcarpetas y cada documento) bajo una carpeta de ELO elegida. Al exportar,
    cada carpeta recibe además un `metadata.opf` (XML) con su máscara, los
    valores de los campos GRP y MAP, fechas y ACL - una copia de seguridad /
    plantilla de importación; al importar, ese archivo se aplica a la nueva
    carpeta de ELO y no se sube como documento. Leer un nivel es
    `findFirstSords` + `findChildren`; los bytes de un documento vienen de
    `checkoutDoc` y luego un `download`; escribir es `createSord`/`checkinSord`
    para carpetas y `createDoc` -> `checkinDocBegin` -> subida ->
    `checkinDocEnd` para archivos. Todo tiene tope (cantidad de objetos y tamaño
    por archivo) y cada error de ELO se captura para que un documento malo no
    corte la ejecución.

elo_api:
  - method: findFirstSords
    rpc: POST /rest/IXServicePortIF/findFirstSords
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/findFirstSords
    notes:
      en: "findInfo.findChildren { parentId, mainParent, endLevel: 1 } returns one level; the tree expands it lazily, one click at a time."
      de: "findInfo.findChildren { parentId, mainParent, endLevel: 1 } liefert eine Ebene; der Baum lädt sie bei Bedarf, Klick für Klick."
      es: "findInfo.findChildren { parentId, mainParent, endLevel: 1 } devuelve un nivel; el árbol lo expande de forma perezosa, un clic por vez."
  - method: checkoutDoc
    rpc: POST /rest/IXServicePortIF/checkoutDoc
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkoutDoc
    notes:
      en: "editInfoZ.bset '320' -> document.docs[0].url; pass an explicit large max_bytes to download() or it silently truncates at 200 KB."
      de: "editInfoZ.bset '320' -> document.docs[0].url; download() ein ausdrücklich großes max_bytes übergeben, sonst wird bei 200 KB stillschweigend abgeschnitten."
      es: "editInfoZ.bset '320' -> document.docs[0].url; pasá un max_bytes grande explícito a download() o trunca en silencio a 200 KB."
  - method: createSord
    rpc: POST /rest/IXServicePortIF/createSord
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/createSord
    notes:
      en: "One per folder created on the way up: maskId 1 ('Ordner'), sordZ inside editInfoZ."
      de: "Einer pro angelegtem Ordner: maskId 1 ('Ordner'), sordZ innerhalb von editInfoZ."
      es: "Uno por cada carpeta creada: maskId 1 ('Ordner'), sordZ dentro de editInfoZ."
  - method: checkinSord
    rpc: POST /rest/IXServicePortIF/checkinSord
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkinSord
    notes:
      en: "Persists the folder and returns its new id, which becomes the parent for its children."
      de: "Speichert den Ordner und liefert seine neue id, die zum Elternobjekt seiner Kinder wird."
      es: "Persiste la carpeta y devuelve su nuevo id, que pasa a ser el padre de sus hijos."
  - method: createDoc
    rpc: POST /rest/IXServicePortIF/createDoc
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/createDoc
    notes:
      en: "One per file: maskId 0 (generic document), then the checkinDocBegin / upload / checkinDocEnd dance."
      de: "Einer pro Datei: maskId 0 (generisches Dokument), dann der Ablauf checkinDocBegin / Upload / checkinDocEnd."
      es: "Uno por archivo: maskId 0 (documento genérico), luego la secuencia checkinDocBegin / subida / checkinDocEnd."
  - method: checkinDocEnd
    rpc: POST /rest/IXServicePortIF/checkinDocEnd
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkinDocEnd
    notes:
      en: "Commits the uploaded bytes; the document is filed under its folder's id."
      de: "Bestätigt die hochgeladenen Bytes; das Dokument wird unter der id seines Ordners abgelegt."
      es: "Confirma los bytes subidos; el documento queda archivado bajo el id de su carpeta."

