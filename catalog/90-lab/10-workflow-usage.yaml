title:
  en: Most used workflows
  de: Meistgenutzte Workflows
  es: Workflows más usados
summary:
  en: >
    Live only, read-only. A table of the 25 workflow templates that were
    started most often, with how many instances are active / finished, when
    a workflow was last started from the template (and on which object),
    the first start, the template's description, owner, node count and
    version. ELO keeps no usage counter on a template, but every started
    workflow records its `templateId`, so the panel lists the templates
    (`findFirstWorkflows` with `findInfo.type.bset: "2"`,
    `WFTypeC.TEMPLATE`), the active instances (`"1"`) and the finished ones
    (`"4"`) and counts per template. Finished workflows exist only until an
    administrator or the workflow cleanup job removes them, so "finished"
    counts what is still on the server. Templates have no description
    field: the start node's comment (or the version comment) is the closest
    thing. `wfDiagramZ.bset` picks the `WFDiagram` members - bits 0
    id/name/version, 4 completionDateIso, 5 nodes, 9 startDateIso, 11
    ownerName, 15 templateName, 23 objName.
  de: "Nur live, nur lesend. Eine Tabelle der 25 am häufigsten gestarteten Workflow-Vorlagen mit der Zahl aktiver / beendeter Instanzen, dem letzten Start aus der Vorlage (und dem Objekt dazu), dem ersten Start, Beschreibung, Eigentümer, Knotenzahl und Version. ELO führt keinen Nutzungszähler an der Vorlage, aber jeder gestartete Workflow trägt seine `templateId` - das Panel liest also die Vorlagen (`findFirstWorkflows` mit `findInfo.type.bset: \"2\"`, `WFTypeC.TEMPLATE`), die aktiven Instanzen (`\"1\"`) und die beendeten (`\"4\"`) und zählt je Vorlage. Beendete Workflows existieren nur, bis ein Administrator oder der Workflow-Bereinigungsjob sie entfernt - \"beendet\" zählt also, was noch auf dem Server liegt. Vorlagen haben kein Beschreibungsfeld; der Kommentar des Startknotens (oder der Versionskommentar) kommt dem am nächsten. `wfDiagramZ.bset` wählt die `WFDiagram`-Felder - Bits 0 id/name/version, 4 completionDateIso, 5 nodes, 9 startDateIso, 11 ownerName, 15 templateName, 23 objName."
  es: "Solo en vivo, solo lectura. Una tabla con las 25 plantillas de workflow más iniciadas, con cuántas instancias hay activas / terminadas, cuándo se inició por última vez un workflow desde la plantilla (y sobre qué objeto), el primer inicio, la descripción de la plantilla, dueño, número de nodos y versión. ELO no lleva un contador de uso en la plantilla, pero cada workflow iniciado registra su `templateId`, así que el panel lista las plantillas (`findFirstWorkflows` con `findInfo.type.bset: \"2\"`, `WFTypeC.TEMPLATE`), las instancias activas (`\"1\"`) y las terminadas (`\"4\"`) y cuenta por plantilla. Los workflows terminados existen solo hasta que un administrador o el job de limpieza los borra, así que \"terminados\" cuenta lo que todavía está en el servidor. Las plantillas no tienen campo de descripción; el comentario del nodo inicial (o el de la versión) es lo más parecido. `wfDiagramZ.bset` elige los campos de `WFDiagram` - bits 0 id/name/version, 4 completionDateIso, 5 nodes, 9 startDateIso, 11 ownerName, 15 templateName, 23 objName."

elo_api:
- method: findFirstWorkflows
  rpc: POST /rest/IXServicePortIF/findFirstWorkflows
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/findFirstWorkflows
  notes:
    en: '`findInfo.type` is a `WFTypeZ` bitset, not an int: `{bset: "2"}` templates, `"1"` active, `"4"` finished. Rows come back in `workflows`; page with `findNextWorkflows {searchId, idx, max, wfDiagramZ}` and release with `findClose`.'
    de: '`findInfo.type` ist ein `WFTypeZ`-Bitset, kein int: `{bset: "2"}` Vorlagen, `"1"` aktiv, `"4"` beendet. Die Zeilen stehen in `workflows`; blättern mit `findNextWorkflows {searchId, idx, max, wfDiagramZ}`, freigeben mit `findClose`.'
    es: '`findInfo.type` es un bitset `WFTypeZ`, no un int: `{bset: "2"}` plantillas, `"1"` activos, `"4"` terminados. Las filas vienen en `workflows`; paginá con `findNextWorkflows {searchId, idx, max, wfDiagramZ}` y liberá con `findClose`.'
- method: findNextWorkflows
  rpc: POST /rest/IXServicePortIF/findNextWorkflows
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/findNextWorkflows
  notes:
    en: 'Same paging contract as findNextSords.'
    de: 'Dasselbe Blätter-Schema wie findNextSords.'
    es: 'El mismo esquema de paginación que findNextSords.'

