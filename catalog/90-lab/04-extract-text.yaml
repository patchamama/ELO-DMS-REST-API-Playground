id: lab.extract-text
order: 4
category:
  en: Testing lab
  de: Testlabor
  es: Laboratorio de pruebas
title:
  en: Send a document to the Textreader and get its text
  de: Ein Dokument an den Textreader geben und den Text erhalten
  es: Enviar un documento al Textreader y obtener su texto
summary:
  en: >
    `processOcr` feeds a file to ELO's OCR engine (the "Textreader") and returns
    the recognised text. Pass EITHER an archived document's `objId` OR raw bytes
    in `recognizeFile.imageData` ({ data: base64, contentType }). Set
    `outputFormat` 0 (OcrInfoC.TEXT) for plain text; the result is in
    `recognizeFile.text`. It can also run asynchronously over the event bus
    (`busId` / `eventId`). For text ELO already extracted at import time, read
    `DocVersion.fulltextContent` from `checkoutDoc` instead - that is the
    iSearch / Elasticsearch index, no re-OCR. NOTE: `processOcr` needs the ELO
    OCR / Textreader module and the fulltext index must be configured - neither
    is guaranteed on a given install, so this topic is shaped from the
    `openapi.json`, not verified live here.
  de: "`processOcr` gibt eine Datei an die OCR-Engine von ELO (den „Textreader“) und liefert den erkannten Text zurück. Entweder die `objId` eines archivierten Dokuments ODER Rohbytes in `recognizeFile.imageData` ({ data: base64, contentType }) übergeben. `outputFormat` 0 (OcrInfoC.TEXT) für reinen Text setzen; das Ergebnis steht in `recognizeFile.text`. Es kann auch asynchron über den Event-Bus laufen (`busId` / `eventId`). Für Text, den ELO beim Import bereits extrahiert hat, stattdessen `DocVersion.fulltextContent` aus `checkoutDoc` lesen - das ist der iSearch-/Elasticsearch-Index, ohne erneutes OCR. HINWEIS: `processOcr` benötigt das ELO-OCR-/Textreader-Modul und der Volltextindex muss konfiguriert sein - beides ist nicht auf jeder Installation vorhanden, daher ist dieses Thema aus der `openapi.json` abgeleitet und hier nicht live bestätigt."
  es: "`processOcr` entrega un archivo al motor OCR de ELO (el «Textreader») y devuelve el texto reconocido. Se pasa O BIEN el `objId` de un documento archivado O BIEN bytes crudos en `recognizeFile.imageData` ({ data: base64, contentType }). Poné `outputFormat` 0 (OcrInfoC.TEXT) para texto plano; el resultado está en `recognizeFile.text`. También puede correr de forma asíncrona por el bus de eventos (`busId` / `eventId`). Para el texto que ELO ya extrajo al importar, leé `DocVersion.fulltextContent` de `checkoutDoc` - ese es el índice iSearch / Elasticsearch, sin re-OCR. NOTA: `processOcr` necesita el módulo OCR / Textreader de ELO y el índice de fulltext debe estar configurado - ninguno está garantizado en una instalación dada, así que este tema está armado desde el `openapi.json`, no verificado en vivo acá."

elo_api:
  - method: processOcr
    rpc: POST /rest/IXServicePortIF/processOcr
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/processOcr
    notes:
      en: 'ocrInfo.recognizeFile: set objId OR imageData; outputFormat 0 = TEXT; pageNo -1 = all pages. Result in recognizeFile.text.'
      de: 'ocrInfo.recognizeFile: objId ODER imageData setzen; outputFormat 0 = TEXT; pageNo -1 = alle Seiten. Ergebnis in recognizeFile.text.'
      es: 'ocrInfo.recognizeFile: poné objId O imageData; outputFormat 0 = TEXT; pageNo -1 = todas las páginas. Resultado en recognizeFile.text.'
  - method: checkoutDoc
    rpc: POST /rest/IXServicePortIF/checkoutDoc
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkoutDoc
    notes:
      en: 'Alternative: DocVersion.fulltextContent carries the text the fulltext pipeline already extracted (read-only).'
      de: 'Alternative: DocVersion.fulltextContent enthält den bereits vom Volltext-Pipeline extrahierten Text (schreibgeschützt).'
      es: 'Alternativa: DocVersion.fulltextContent lleva el texto que el pipeline de fulltext ya extrajo (solo lectura).'

result_shape: |
  OCR text:
  INVOICE 2026-0042
  Acme GmbH
  Total: 1,234.56 EUR

snippets:
  python: |
    from elo_playground import connect
    # import base64

    elo = connect()

    obj_id = "4711"     # an archived document to run OCR on

    res = elo.call("processOcr", {"ocrInfo": {
        "recognizeFile": {
            "objId": obj_id,        # ...OR: "imageData": {"data": base64.b64encode(pdf_bytes).decode(),
            "outputFormat": 0,      #                        "contentType": "application/pdf"}
            "pageNo": -1,           # -1 = every page
        },
    }})

    rf = res.get("recognizeFile") or {}
    if res.get("exception"):
        print("OCR error:", res["exception"])
    else:
        print("OCR text:")
        print((rf.get("text") or "").strip())

  node: |
    import { connect } from "elo-playground";

    const elo = await connect();

    const objId = "4711"; // an archived document to run OCR on

    const res = await elo.call("processOcr", {
      ocrInfo: {
        recognizeFile: {
          objId,           // ...OR: imageData: { data: <base64>, contentType: "application/pdf" }
          outputFormat: 0, // OcrInfoC.TEXT -> plain text
          pageNo: -1,      // -1 = every page
        },
      },
    });

    const rf = res.recognizeFile || {};
    if (res.exception) console.error("OCR error:", res.exception);
    else {
      console.log("OCR text:");
      console.log((rf.text || "").trim());
    }

  browser: |
    const elo = await connect();
    const objId = "4711";

    const res = await elo.call("processOcr", {
      ocrInfo: { recognizeFile: { objId, outputFormat: 0, pageNo: -1 } },
    });
    const rf = res.recognizeFile || {};
    if (res.exception) console.error("OCR error:", res.exception);
    else { console.log("OCR text:"); console.log((rf.text || "").trim()); }

mock:
  processOcr:
    recognizeFile:
      text: "INVOICE 2026-0042\nAcme GmbH\nTotal: 1,234.56 EUR\n"
