order: 8
lab_perms: true
category:
  en: Testing lab
  de: Testlabor
  es: Laboratorio de pruebas
title:
  en: Check user/folder permissions
  de: Benutzer-/Ordnerberechtigungen prüfen
  es: Comprobar permisos de usuarios y carpetas
summary:
  en: >
    A read-only permissions explorer, live only (it never writes anything). Pick
    a group or user and the folder tree shows each first-level folder's resolved
    access, drilling into subfolders on click; or pick one folder and see every
    user/group with access to it. `sord.aclItems` is the permission list - each
    entry is `{id, type, access}` where `access` is a bitmask (1 R, 2 W, 4 D,
    8 edit-rights, 16 L, 32 P; 63 = full), read via `checkoutSord`. There is no
    "effective permission" RPC, so access is resolved here: a principal has
    access to a folder when their own id is in its `aclItems`, or - for a user -
    any group in their `UserInfo.groupList` is. The connected administrator
    still sees everything regardless of what is shown for the picked principal -
    that is ELO's own server-side ACL bypass, not something this panel fakes.

  de: "Ein reiner Lese-Explorer für Berechtigungen, nur live (er schreibt nie etwas). Eine Gruppe oder einen Benutzer wählen, und der Ordnerbaum zeigt für jeden Ordner der ersten Ebene den aufgelösten Zugriff, per Klick geht es in Unterordner; oder einen Ordner wählen und jeden Benutzer/jede Gruppe mit Zugriff darauf sehen. `sord.aclItems` ist die Berechtigungsliste - jeder Eintrag ist `{id, type, access}`, wobei `access` eine Bitmaske ist (1 R, 2 W, 4 D, 8 Rechte, 16 L, 32 P; 63 = voll), gelesen über `checkoutSord`. Es gibt keinen RPC für \"effektive Berechtigung\", daher wird der Zugriff hier aufgelöst: ein Principal hat Zugriff auf einen Ordner, wenn seine eigene ID in dessen `aclItems` steht, oder - bei einem Benutzer - irgendeine Gruppe aus seiner `UserInfo.groupList`. Der angemeldete Administrator sieht weiterhin alles, unabhängig davon, was für den gewählten Principal angezeigt wird - das ist ELOs eigene serverseitige ACL-Umgehung, nichts, was dieses Panel vortäuscht."
  es: "Un explorador de permisos de solo lectura, únicamente en vivo (nunca escribe nada). Elegís un grupo o usuario y el árbol de carpetas muestra el acceso resuelto de cada carpeta de primer nivel, navegando a las subcarpetas al hacer clic; o elegís una carpeta y ves todos los usuarios/grupos con acceso a ella. `sord.aclItems` es la lista de permisos - cada entrada es `{id, type, access}`, donde `access` es una máscara de bits (1 R, 2 W, 4 D, 8 derechos, 16 L, 32 P; 63 = total), leída con `checkoutSord`. No existe un RPC de \"permiso efectivo\", así que el acceso se resuelve acá: un principal tiene acceso a una carpeta cuando su propio id está en el `aclItems` de esa carpeta, o - para un usuario - cuando algún grupo de su `UserInfo.groupList` lo está. El administrador conectado sigue viendo todo igual, sin importar lo que se muestre para el principal elegido - eso es la propia evasión de ACL del lado del servidor de ELO, no algo que este panel simule."

elo_api:
- method: findFirstUsers
  rpc: POST /rest/IXServicePortIF/findFirstUsers
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/findFirstUsers
  notes:
    en: 'Body { findUserInfo: { onlyGroups: true } } lists groups; { onlyUsers: true } lists users. Rows are in "sortedResult".'
    de: 'Body { findUserInfo: { onlyGroups: true } } listet Gruppen; { onlyUsers: true } listet Benutzer. Die Zeilen stehen in "sortedResult".'
    es: 'Cuerpo { findUserInfo: { onlyGroups: true } } lista grupos; { onlyUsers: true } lista usuarios. Las filas están en "sortedResult".'
- method: checkoutUsers
  rpc: POST /rest/IXServicePortIF/checkoutUsers
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/checkoutUsers
  notes:
    en: 'One batched call ({ids, checkoutUsersZ:{bset:"513"}}) resolves every user''s groupList at once - there is no "members of group X" RPC, so this is the only way to answer that without one call per user.'
    de: 'Ein gebündelter Aufruf ({ids, checkoutUsersZ:{bset:"513"}}) löst die groupList aller Benutzer auf einmal auf - es gibt keinen RPC für "Mitglieder von Gruppe X", das ist der einzige Weg ohne einen Aufruf pro Benutzer.'
    es: 'Una llamada agrupada ({ids, checkoutUsersZ:{bset:"513"}}) resuelve el groupList de todos los usuarios de una vez - no existe un RPC de "miembros del grupo X", así que es la única forma sin una llamada por usuario.'
- method: findFirstSords
  rpc: POST /rest/IXServicePortIF/findFirstSords
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/findFirstSords
  notes:
    en: '`findInfo.findChildren {parentId, mainParent, endLevel:1}` - one level of the folder tree, same shape as the "Testing lab" filesystem panel.'
    de: '`findInfo.findChildren {parentId, mainParent, endLevel:1}` - eine Ebene des Ordnerbaums, dieselbe Form wie im Dateisystem-Panel des "Testlabors".'
    es: '`findInfo.findChildren {parentId, mainParent, endLevel:1}` - un nivel del árbol de carpetas, la misma forma que el panel de sistema de archivos del "Laboratorio de pruebas".'
- method: checkoutSord
  rpc: POST /rest/IXServicePortIF/checkoutSord
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/checkoutSord
  notes:
    en: 'The only way to read a folder''s aclItems - read-only here, unlike "Change owner, colour and permissions" which also writes it back.'
    de: 'Der einzige Weg, die aclItems eines Ordners zu lesen - hier nur lesend, anders als bei "Eigentümer, Farbe und Berechtigungen ändern", das sie auch zurückschreibt.'
    es: 'La única forma de leer los aclItems de una carpeta - acá solo de lectura, a diferencia de "Cambiar dueño, color y permisos", que también los escribe de vuelta.'

