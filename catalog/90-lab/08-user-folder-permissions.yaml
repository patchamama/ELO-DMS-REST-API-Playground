title:
  en: Check user/folder permissions
  de: Benutzer-/Ordnerberechtigungen prüfen
  es: Comprobar permisos de usuarios y carpetas
summary:
  en: >
    A read-only permissions explorer, live only (it never writes anything). Pick
    a group or user and the folder tree shows each folder's resolved access
    (greyed out where there is none), drilling into subfolders on click; or pick
    one folder and see every user/group with access to it. "Exclusive" narrows
    both views to what the selection alone can reach (main administrators
    bypass every ACL, so they are left out); "Special ACLs" lists the folders
    whose ACL departs from their parent's - ELO copies the parent's ACL onto
    each new child, so a difference means special permissions were set on
    purpose. Clicking a folder dumps its decoded ACL, and how it differs from
    the parent's, into the log. There is no "effective permission" RPC,
    so the IX ACL model (`AclItemC` / `AccessC`) is applied here:
    `sord.aclItems` entries are `{id, type, access, andGroups}` with `type`
    0 = group, 1 = user, 100 = inherit the parent's ACL, 200 = the owner;
    `access` is a bitmask (1 R, 2 W, 4 D, 8 E, 16 L, 32 P; 63 = full); an
    `andGroups` entry needs membership in every listed group. Groups nest
    (a group's own `groupList` names its parents) and a user's `groupList`
    holds only direct memberships, so membership is the transitive closure.
    `UserInfo.flags` bit 1 on a user OR a group is a main administrator and
    bypasses every ACL server-side - so does the connected administrator, no
    matter what is shown for the picked principal.

  de: "Ein reiner Lese-Explorer für Berechtigungen, nur live (er schreibt nie etwas). Eine Gruppe oder einen Benutzer wählen, und der Ordnerbaum zeigt den aufgelösten Zugriff jedes Ordners (ausgegraut ohne Zugriff), per Klick geht es in Unterordner; oder einen Ordner wählen und jeden Benutzer/jede Gruppe mit Zugriff darauf sehen. \"Exklusiv\" beschränkt beide Ansichten auf das, was die Auswahl allein erreicht (Hauptadministratoren umgehen jede ACL und bleiben außen vor); \"Spezielle ACLs\" listet die Ordner, deren ACL von der des Elternordners abweicht - ELO kopiert die ACL des Elternordners auf jeden neuen Unterordner, eine Abweichung bedeutet also absichtlich gesetzte Sonderberechtigungen. Ein Klick auf einen Ordner schreibt seine dekodierte ACL, und wie sie vom Elternordner abweicht, ins Protokoll. Es gibt keinen RPC für \"effektive Berechtigung\", daher wird hier das IX-ACL-Modell (`AclItemC` / `AccessC`) angewendet: `sord.aclItems`-Einträge sind `{id, type, access, andGroups}` mit `type` 0 = Gruppe, 1 = Benutzer, 100 = ACL des Elternordners erben, 200 = Eigentümer; `access` ist eine Bitmaske (1 R, 2 W, 4 D, 8 E, 16 L, 32 P; 63 = voll); ein `andGroups`-Eintrag verlangt Mitgliedschaft in jeder aufgeführten Gruppe. Gruppen sind verschachtelt (die eigene `groupList` einer Gruppe nennt ihre Eltern) und die `groupList` eines Benutzers enthält nur direkte Mitgliedschaften, Mitgliedschaft ist also die transitive Hülle. `UserInfo.flags` Bit 1 bei einem Benutzer ODER einer Gruppe ist ein Hauptadministrator und umgeht serverseitig jede ACL - ebenso der angemeldete Administrator, unabhängig davon, was für den gewählten Principal angezeigt wird."
  es: "Un explorador de permisos de solo lectura, únicamente en vivo (nunca escribe nada). Elegís un grupo o usuario y el árbol de carpetas muestra el acceso resuelto de cada carpeta (en gris si no hay), navegando a las subcarpetas al hacer clic; o elegís una carpeta y ves todos los usuarios/grupos con acceso a ella. \"Exclusivo\" reduce ambas vistas a lo que alcanza la selección por sí sola (los administradores principales se saltan cualquier ACL, así que quedan fuera); \"ACL especiales\" lista las carpetas cuyo ACL difiere del de su padre - ELO copia el ACL del padre a cada carpeta hija nueva, así que una diferencia significa permisos especiales puestos a propósito. Un clic en una carpeta vuelca su ACL decodificado, y en qué difiere del padre, al registro. No existe un RPC de \"permiso efectivo\", así que acá se aplica el modelo ACL de IX (`AclItemC` / `AccessC`): las entradas de `sord.aclItems` son `{id, type, access, andGroups}` con `type` 0 = grupo, 1 = usuario, 100 = heredar el ACL del padre, 200 = el dueño; `access` es una máscara de bits (1 R, 2 W, 4 D, 8 E, 16 L, 32 P; 63 = total); una entrada con `andGroups` exige pertenecer a todos los grupos listados. Los grupos se anidan (el `groupList` propio de un grupo nombra a sus padres) y el `groupList` de un usuario solo tiene membresías directas, así que la membresía es la clausura transitiva. `UserInfo.flags` bit 1 en un usuario O en un grupo es administrador principal y se salta cualquier ACL del lado del servidor - igual que el administrador conectado, sin importar lo que se muestre para el principal elegido."

elo_api:
- method: findFirstUsers
  rpc: POST /rest/IXServicePortIF/findFirstUsers
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/findFirstUsers
  notes:
    en: 'Body { findUserInfo: { onlyGroups: true } } lists groups; { onlyUsers: true } lists users. Rows are in "sortedResult".'
    de: 'Body { findUserInfo: { onlyGroups: true } } listet Gruppen; { onlyUsers: true } listet Benutzer. Die Zeilen stehen in "sortedResult".'
    es: 'Cuerpo { findUserInfo: { onlyGroups: true } } lista grupos; { onlyUsers: true } lista usuarios. Las filas están en "sortedResult".'
- method: checkoutUsers
  rpc: POST /rest/IXServicePortIF/checkoutUsers
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/checkoutUsers
  notes:
    en: 'One batched call ({ids, checkoutUsersZ:{bset:"513"}}) resolves every user''s groupList at once - there is no "members of group X" RPC, so this is the only way to answer that without one call per user.'
    de: 'Ein gebündelter Aufruf ({ids, checkoutUsersZ:{bset:"513"}}) löst die groupList aller Benutzer auf einmal auf - es gibt keinen RPC für "Mitglieder von Gruppe X", das ist der einzige Weg ohne einen Aufruf pro Benutzer.'
    es: 'Una llamada agrupada ({ids, checkoutUsersZ:{bset:"513"}}) resuelve el groupList de todos los usuarios de una vez - no existe un RPC de "miembros del grupo X", así que es la única forma sin una llamada por usuario.'
- method: findFirstSords
  rpc: POST /rest/IXServicePortIF/findFirstSords
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/findFirstSords
  notes:
    en: '`findInfo.findChildren {parentId, mainParent, endLevel:1}` - one level of the folder tree, same shape as the "Testing lab" filesystem panel.'
    de: '`findInfo.findChildren {parentId, mainParent, endLevel:1}` - eine Ebene des Ordnerbaums, dieselbe Form wie im Dateisystem-Panel des "Testlabors".'
    es: '`findInfo.findChildren {parentId, mainParent, endLevel:1}` - un nivel del árbol de carpetas, la misma forma que el panel de sistema de archivos del "Laboratorio de pruebas".'
- method: checkoutSord
  rpc: POST /rest/IXServicePortIF/checkoutSord
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/checkoutSord
  notes:
    en: 'The only way to read a folder''s aclItems - read-only here, unlike "Change owner, colour and permissions" which also writes it back.'
    de: 'Der einzige Weg, die aclItems eines Ordners zu lesen - hier nur lesend, anders als bei "Eigentümer, Farbe und Berechtigungen ändern", das sie auch zurückschreibt.'
    es: 'La única forma de leer los aclItems de una carpeta - acá solo de lectura, a diferencia de "Cambiar dueño, color y permisos", que también los escribe de vuelta.'

