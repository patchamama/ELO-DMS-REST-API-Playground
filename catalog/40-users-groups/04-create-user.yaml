id: users.create
order: 4
category:
  en: Users & groups
  de: Benutzer & Gruppen
  es: Usuarios y grupos
title:
  en: Create a user and a group, link them (write)
  de: Einen Benutzer und eine Gruppe anlegen und verknüpfen (schreibend)
  es: Crear un usuario y un grupo y vincularlos (escritura)
summary:
  en: >
    `checkinUsers` creates and updates principals - a UserInfo with `id: -1`
    creates a new one; `type` 1 = user, 0 = group. Group membership is just the
    user's `groupList`: check the user out, append the group id, check it back
    in. `deleteUsers` removes them. This WRITES. (Verified live - the
    test user and group were deleted.)
  de: "`checkinUsers` legt Principals an und aktualisiert sie - ein UserInfo mit `id: -1` legt einen neuen an; `type` 1 = Benutzer, 0 = Gruppe. Gruppenzugehörigkeit ist einfach die `groupList` des Benutzers: Benutzer auschecken, Gruppen-ID anhängen, wieder einchecken. `deleteUsers` entfernt sie. Das SCHREIBT. (Live bestätigt - Testbenutzer und -gruppe wurden gelöscht.)"
  es: "`checkinUsers` crea y actualiza principales - un UserInfo con `id: -1` crea uno nuevo; `type` 1 = usuario, 0 = grupo. La pertenencia a un grupo es simplemente el `groupList` del usuario: hacé checkout del usuario, agregá el id del grupo, hacé checkin. `deleteUsers` los quita. Esto ESCRIBE. (Verificado en vivo - el usuario y el grupo de prueba se borraron.)"

elo_api:
  - method: checkinUsers
    rpc: POST /rest/IXServicePortIF/checkinUsers
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkinUsers
    notes:
      en: >
        Body { userInfos: [UserInfo], checkinUsersZ, unlockZ }. New principal:
        id -1. `type` is fixed at creation. Passwords must satisfy the server
        policy (this instance: >= 15 chars). Returns the new ids.
      de: 'Body { userInfos: [UserInfo], checkinUsersZ, unlockZ }. Neuer Principal: id -1. `type` ist bei der Erstellung fix. Passwörter müssen der Serverrichtlinie genügen (diese Instanz: >= 15 Zeichen). Liefert die neuen IDs.'
      es: 'Cuerpo { userInfos: [UserInfo], checkinUsersZ, unlockZ }. Nuevo principal: id -1. El `type` es fijo al crear. Las contraseñas deben cumplir la política del servidor (esta instancia: >= 15 caracteres). Devuelve los nuevos ids.'
  - method: checkoutUsers
    rpc: POST /rest/IXServicePortIF/checkoutUsers
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkoutUsers
    notes:
      en: 'checkoutUsersZ {bset:"513"} (BY_IDS) to read a full UserInfo for editing.'
      de: 'checkoutUsersZ {bset:"513"} (BY_IDS), um ein vollständiges UserInfo zum Bearbeiten zu lesen.'
      es: 'checkoutUsersZ {bset:"513"} (BY_IDS) para leer un UserInfo completo y editarlo.'
  - method: deleteUsers
    rpc: POST /rest/IXServicePortIF/deleteUsers
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/deleteUsers
    notes:
      en: 'Body { ids: [int], unlockZ }. Removing a user is immediate, no recycle bin.'
      de: 'Body { ids: [int], unlockZ }. Einen Benutzer zu entfernen wirkt sofort, kein Papierkorb.'
      es: 'Cuerpo { ids: [int], unlockZ }. Quitar un usuario es inmediato, sin papelera.'

result_shape: |
  created user id: 27
  created group id: 28
  user is now in groups: [3, 28, 9999]

snippets:
  python: |
    from elo_playground import connect, EloError

    # --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    ELO_BASE_URL = "http://localhost:9090/ix-Repository1"
    ELO_USER = "Administrator"
    ELO_PASS = "elo"

    elo = connect(base_url=ELO_BASE_URL, user=ELO_USER, password=ELO_PASS)
    USER, GROUP = "pg.demo.user", "pg.demo.group"

    def drop(*names):
        """Delete principals by name if they exist (tidy up a previous run)."""
        for name in names:
            try:
                ids = [u["id"] for u in elo.call("checkoutUsers",
                                                 {"ids": [name], "checkoutUsersZ": {"bset": "1"}})]
                if ids:
                    elo.call("deleteUsers", {"ids": ids})
            except EloError:
                pass

    uid = gid = None
    try:
        drop(USER, GROUP)                       # start from a clean slate

        # 1) create a user (type 1) - id -1 means "new"
        uid = elo.call("checkinUsers", {
            "userInfos": [{"id": -1, "name": USER, "type": 1, "pwd": "PlaygroundDemoUser2026!"}],
            "checkinUsersZ": {"bset": "1"}, "unlockZ": {"bset": "1"},
        })[0]
        print("created user id:", uid)

        # 2) create a group (type 0)
        gid = elo.call("checkinUsers", {
            "userInfos": [{"id": -1, "name": GROUP, "type": 0}],
            "checkinUsersZ": {"bset": "1"}, "unlockZ": {"bset": "1"},
        })[0]
        print("created group id:", gid)

        # 3) add the user to the group (edit its groupList)
        ui = elo.call("checkoutUsers", {"ids": [uid], "checkoutUsersZ": {"bset": "513"}})[0]
        ui["groupList"] = sorted(set((ui.get("groupList") or []) + [gid]))
        elo.call("checkinUsers", {"userInfos": [ui], "checkinUsersZ": {"bset": "513"},
                                  "unlockZ": {"bset": "1"}})

        back = elo.call("checkoutUsers", {"ids": [uid], "checkoutUsersZ": {"bset": "513"}})[0]
        print("user is now in groups:", back.get("groupList"))
    except EloError as exc:
        print("user/group operation failed:", exc)
    finally:
        drop(USER, GROUP)                       # remove the demo principals
        print("cleaned up")
        elo.close()

  node: |
    import { connect, EloError } from "elo-playground";

    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = "http://localhost:9090/ix-Repository1";
    const ELO_USER = "Administrator";
    const ELO_PASS = "elo";

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });
    const USER = "pg.demo.user";
    const GROUP = "pg.demo.group";

    const drop = async (...names) => {
      for (const name of names) {
        try {
          const ids = (await elo.call("checkoutUsers", { ids: [name], checkoutUsersZ: { bset: "1" } }))
            .map((u) => u.id);
          if (ids.length) await elo.call("deleteUsers", { ids });
        } catch (e) { /* not there - fine */ }
      }
    };

    let uid = null;
    let gid = null;
    try {
      await drop(USER, GROUP); // start clean

      // 1) create a user (type 1) - id -1 means "new"
      [uid] = await elo.call("checkinUsers", {
        userInfos: [{ id: -1, name: USER, type: 1, pwd: "PlaygroundDemoUser2026!" }],
        checkinUsersZ: { bset: "1" }, unlockZ: { bset: "1" },
      });
      console.log("created user id:", uid);

      // 2) create a group (type 0)
      [gid] = await elo.call("checkinUsers", {
        userInfos: [{ id: -1, name: GROUP, type: 0 }],
        checkinUsersZ: { bset: "1" }, unlockZ: { bset: "1" },
      });
      console.log("created group id:", gid);

      // 3) add the user to the group (edit its groupList)
      const ui = (await elo.call("checkoutUsers", { ids: [uid], checkoutUsersZ: { bset: "513" } }))[0];
      ui.groupList = [...new Set([...(ui.groupList || []), gid])].sort((a, b) => a - b);
      await elo.call("checkinUsers", { userInfos: [ui], checkinUsersZ: { bset: "513" }, unlockZ: { bset: "1" } });

      const back = (await elo.call("checkoutUsers", { ids: [uid], checkoutUsersZ: { bset: "513" } }))[0];
      console.log("user is now in groups:", back.groupList);
    } catch (exc) {
      if (exc instanceof EloError) console.log("user/group operation failed:", exc.message);
      else throw exc;
    } finally {
      await drop(USER, GROUP);
      console.log("cleaned up");
      elo.close();
    }

  browser: |
    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = "http://localhost:9090/ix-Repository1";
    const ELO_USER = "Administrator";
    const ELO_PASS = "elo";

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });
    const USER = "pg.demo.user";

    const drop = async (name) => {
      try {
        const ids = (await elo.call("checkoutUsers", { ids: [name], checkoutUsersZ: { bset: "1" } }))
          .map((u) => u.id);
        if (ids.length) await elo.call("deleteUsers", { ids });
      } catch (e) { /* not there */ }
    };

    try {
      await drop(USER);
      const [uid] = await elo.call("checkinUsers", {
        userInfos: [{ id: -1, name: USER, type: 1, pwd: "PlaygroundDemoUser2026!" }],
        checkinUsersZ: { bset: "1" }, unlockZ: { bset: "1" },
      });
      console.log("created user id:", uid);
    } catch (exc) {
      console.log("user operation failed:", exc.message);
    } finally {
      await drop(USER);
      console.log("cleaned up");
    }

