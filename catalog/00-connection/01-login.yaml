id: connection.login
order: 1
category:
  en: Connection & session
  de: Verbindung & Sitzung
  es: Conexión y sesión
title:
  en: Log in and open a session
  de: Anmelden und Sitzung öffnen
  es: Iniciar sesión y abrir una sesión
summary:
  en: >
    Every IX call needs HTTP Basic auth, but you still start with `login`: it
    allocates the server-side session (licence slot, session options, the
    search-id space used by every `findFirst*`). The shared client keeps one
    connection alive so the session cookie rides along afterwards. The snippet
    catches a wrong Base URL / user / password and prints a clear message
    instead of a stack trace.

  de: "Jeder IX-Aufruf braucht HTTP-Basic-Auth, trotzdem beginnt man mit `login`: das reserviert die serverseitige Sitzung (Lizenzplatz, Sitzungsoptionen, den von jedem `findFirst*` genutzten Such-ID-Bereich). Der gemeinsame Client hält eine Verbindung offen, damit das Sitzungscookie danach mitgeschickt wird. Das Snippet fängt eine falsche Basis-URL / Benutzer / Kennwort ab und gibt eine klare Meldung statt eines Stacktraces aus."
  es: "Cada llamada a IX necesita autenticación HTTP Basic, pero igual se empieza por `login`: reserva la sesión del lado del servidor (plaza de licencia, opciones de sesión, el espacio de ids de búsqueda que usa cada `findFirst*`). El cliente compartido mantiene una conexión viva para que la cookie de sesión viaje después. El snippet captura una URL base / usuario / contraseña equivocados y muestra un mensaje claro en lugar de un stack trace."

elo_api:
- method: login
  rpc: POST /rest/IXServicePortIF/login
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/login
  notes:
    en: >
      Body carries userName / userPwd / clientComputer / ci (locale). HTTP
      Basic must ALSO be present on this and every later request.

    de: Der Body enthält userName / userPwd / clientComputer / ci (Locale). HTTP Basic muss ZUSÄTZLICH bei diesem und jedem weiteren Request gesetzt sein.
    es: El cuerpo lleva userName / userPwd / clientComputer / ci (configuración regional). La autenticación HTTP Basic debe estar ADEMÁS presente en esta y en todas las peticiones siguientes.
result_shape: |
  {
    "user": {
      "id": 0,
      "name": "Administrator",
      "type": 1,
      "guid": "(E10E1000-E100-E100-E100-E10E10E10E40)",
      "groupList": [9998, 9999]
    }
  }

snippets:
  python: |
    import os
    from elo_playground import connect, EloError

    # --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    ELO_BASE_URL = os.getenv("ELOPG_ELO_BASE_URL", "http://localhost:9090/ix-Repository1") # ELOPG_DEFAULT:base_url
    ELO_USER = os.getenv("ELOPG_ELO_USER", "Administrator") # ELOPG_DEFAULT:user
    ELO_PASS = os.getenv("ELOPG_ELO_PASSWORD", "elo") # ELOPG_DEFAULT:password

    # login=False builds the client but does NOT log in yet, so we can call
    # login() ourselves below, read what it returns and handle a failure.
    elo = connect(base_url=ELO_BASE_URL, user=ELO_USER, password=ELO_PASS, login=False)

    try:
        user = elo.login()             # -> POST /rest/IXServicePortIF/login
        print("logged in as:", user["name"], "(id " + str(user["id"]) + ")")
        print("member of groups:", user.get("groupList"))
    except EloError as exc:
        msg = str(exc)
        if "ELOIX:3008" in msg or "authentication failed" in msg or "HTTP 401" in msg or "HTTP 403" in msg:
            print("login failed: wrong user or password -", msg)
        elif "request failed" in msg:
            print("login failed: cannot reach the server, check the host/port in ELO_BASE_URL -", msg)
        elif "HTTP 404" in msg:
            print("login failed: the repository path in ELO_BASE_URL looks wrong -", msg.split(" - ")[0])
        else:
            print("login failed:", msg)
    finally:
        elo.close()                    # release the connection pool

  node: |
    import { connect, EloError } from "elo-playground";

    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = process.env.ELOPG_ELO_BASE_URL || "http://localhost:9090/ix-Repository1"; // ELOPG_DEFAULT:base_url
    const ELO_USER = process.env.ELOPG_ELO_USER || "Administrator"; // ELOPG_DEFAULT:user
    const ELO_PASS = process.env.ELOPG_ELO_PASSWORD || "elo"; // ELOPG_DEFAULT:password

    // login:false builds the client but does NOT log in yet, so we can call
    // login() ourselves below, read what it returns and handle a failure.
    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS, login: false });

    try {
      const user = await elo.login();  // -> POST /rest/IXServicePortIF/login
      console.log("logged in as:", user.name, `(id ${user.id})`);
      console.log("member of groups:", user.groupList);
    } catch (exc) {
      if (!(exc instanceof EloError)) throw exc;
      const msg = exc.message;
      if (/ELOIX:3008|authentication failed|HTTP 401|HTTP 403/.test(msg)) {
        console.log("login failed: wrong user or password -", msg);
      } else if (/request failed/.test(msg)) {
        console.log("login failed: cannot reach the server, check the host/port in ELO_BASE_URL -", msg);
      } else if (/HTTP 404/.test(msg)) {
        console.log("login failed: the repository path in ELO_BASE_URL looks wrong -", msg.split(" - ")[0]);
      } else {
        console.log("login failed:", msg);
      }
    } finally {
      elo.close();
    }

  browser: |
    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = globalThis.ELOPG_ELO_BASE_URL || "http://localhost:9090/ix-Repository1"; // ELOPG_DEFAULT:base_url
    const ELO_USER = globalThis.ELOPG_ELO_USER || "Administrator"; // ELOPG_DEFAULT:user
    const ELO_PASS = globalThis.ELOPG_ELO_PASSWORD || "elo"; // ELOPG_DEFAULT:password

    // connect() is preloaded by the playground; in the browser the call goes
    // to the playground backend, which forwards the RPC (or answers from mock
    // data). login:false lets us call login() ourselves below and handle a failure.
    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS, login: false });

    try {
      const user = await elo.login();  // -> POST /api/elo/proxy -> IX login
      console.log("logged in as:", user.name, `(id ${user.id})`);
      console.log("member of groups:", user.groupList);
    } catch (exc) {
      const msg = (exc && exc.message) || String(exc);
      if (/ELOIX:3008|authentication failed|HTTP 401|HTTP 403/.test(msg)) {
        console.log("login failed: wrong user or password -", msg);
      } else if (/request failed|fetch failed|Failed to fetch|NetworkError/.test(msg)) {
        console.log("login failed: cannot reach the server -", msg);
      } else if (/HTTP 404/.test(msg)) {
        console.log("login failed: the repository path in ELO_BASE_URL looks wrong -", msg.split(" - ")[0]);
      } else {
        console.log("login failed:", msg);
      }
    }

