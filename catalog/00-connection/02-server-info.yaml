id: connection.server-info
order: 2
category:
  en: Connection & session
  de: Verbindung & Sitzung
  es: Conexión y sesión
title:
  en: Read server info and licence
  de: Serverinfo und Lizenz lesen
  es: Leer info del servidor y licencia
summary:
  en: >
    `getServerInfo` is the quickest "am I really talking to ELO?" check. It
    returns the repository name, the IX build version, the database engine and
    the licence (serial, product, valid-through, user count, feature flags).

  de: "`getServerInfo` ist die schnellste Prüfung nach dem Motto „rede ich wirklich mit ELO?“. Es liefert den Repository-Namen, die IX-Build-Version, die Datenbank-Engine und die Lizenz (Seriennummer, Produkt, Gültigkeit, Benutzeranzahl, Feature-Flags)."
  es: "`getServerInfo` es la comprobación más rápida de “¿realmente estoy hablando con ELO?”. Devuelve el nombre del repositorio, la versión de build de IX, el motor de base de datos y la licencia (serie, producto, validez, número de usuarios, indicadores de funciones)."

elo_api:
- method: getServerInfo
  rpc: POST /rest/IXServicePortIF/getServerInfo
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/getServerInfo
  notes:
    en: No parameters. The interesting fields are nested under indexServers[0] and license.

    de: Keine Parameter. Die interessanten Felder liegen unter indexServers[0] und license.
    es: Sin parámetros. Los campos interesantes están anidados bajo indexServers[0] y license.
result_shape: |
  {
    "version": "25.00.001.003",
    "instanceName": "ELO-BASIS",
    "databaseEngine": "MS SQL Server",
    "indexServers": [ { "arcName": "Repository1", "url": "http://elo:9090/ix-Repository1/ix" } ],
    "license": { "serno": "...", "licenseOptions": { "product": "ELO ECM Suite", "usercount1": "50" } }
  }

snippets:
  python: |
    import os
    from elo_playground import connect

    # --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    ELO_BASE_URL = os.getenv("ELOPG_ELO_BASE_URL", "http://localhost:9090/ix-Repository1") # ELOPG_DEFAULT:base_url
    ELO_USER = os.getenv("ELOPG_ELO_USER", "Administrator") # ELOPG_DEFAULT:user
    ELO_PASS = os.getenv("ELOPG_ELO_PASSWORD", "elo") # ELOPG_DEFAULT:password

    elo = connect(base_url=ELO_BASE_URL, user=ELO_USER, password=ELO_PASS)  # env vars + login() already done

    info = elo.call("getServerInfo", {})         # -> POST .../getServerInfo
    server = (info.get("indexServers") or [{}])[0]
    lic = (info.get("license") or {}).get("licenseOptions", {})

    print("repository :", server.get("arcName"))
    print("IX version :", info.get("version"))
    print("database   :", info.get("databaseEngine"))
    print("product    :", lic.get("product"), "/ users:", lic.get("usercount1"))

  node: |
    import { connect } from "elo-playground";

    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = process.env.ELOPG_ELO_BASE_URL || "http://localhost:9090/ix-Repository1"; // ELOPG_DEFAULT:base_url
    const ELO_USER = process.env.ELOPG_ELO_USER || "Administrator"; // ELOPG_DEFAULT:user
    const ELO_PASS = process.env.ELOPG_ELO_PASSWORD || "elo"; // ELOPG_DEFAULT:password

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });  // env vars + login() already done

    const info = await elo.call("getServerInfo", {});
    const server = (info.indexServers || [{}])[0];
    const lic = (info.license || {}).licenseOptions || {};

    console.log("repository :", server.arcName);
    console.log("IX version :", info.version);
    console.log("database   :", info.databaseEngine);
    console.log("product    :", lic.product, "/ users:", lic.usercount1);

  browser: |
    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = globalThis.ELOPG_ELO_BASE_URL || "http://localhost:9090/ix-Repository1"; // ELOPG_DEFAULT:base_url
    const ELO_USER = globalThis.ELOPG_ELO_USER || "Administrator"; // ELOPG_DEFAULT:user
    const ELO_PASS = globalThis.ELOPG_ELO_PASSWORD || "elo"; // ELOPG_DEFAULT:password

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });

    const info = await elo.call("getServerInfo", {});
    const server = (info.indexServers || [{}])[0];
    console.log("repository :", server.arcName);
    console.log("IX version :", info.version);
    console.log("database   :", info.databaseEngine);

