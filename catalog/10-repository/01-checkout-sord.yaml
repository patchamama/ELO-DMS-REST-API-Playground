id: repository.checkout-sord
order: 1
category:
  en: Repository & objects
  de: Archiv & Objekte
  es: Repositorio y objetos
title:
  en: Resolve a GUID to an object (Sord)
  de: Eine GUID zu einem Objekt (Sord) auflösen
  es: Resolver un GUID a un objeto (Sord)
summary:
  en: >
    Everything in the ELO archive - folders and documents alike - is a "Sord"
    (Structured Object Data). `checkoutSord` loads one by object id or by the
    parenthesised GUID ELO prints in its UI, and returns its name, mask, type
    and ACL. Type >= 254 means it is a document, not a folder.

  de: "Alles im ELO-Archiv – Ordner wie Dokumente – ist ein „Sord“ (Structured Object Data). `checkoutSord` lädt eines über die Objekt-ID oder über die geklammerte GUID, die ELO in der Oberfläche anzeigt, und liefert Name, Maske, Typ und ACL. Typ >= 254 bedeutet Dokument, nicht Ordner."
  es: "Todo en el archivo de ELO – carpetas y documentos por igual – es un “Sord” (Structured Object Data). `checkoutSord` carga uno por id de objeto o por el GUID entre paréntesis que ELO muestra en su interfaz, y devuelve su nombre, máscara, tipo y ACL. Tipo >= 254 significa que es un documento, no una carpeta."

elo_api:
- method: checkoutSord
  rpc: POST /rest/IXServicePortIF/checkoutSord
  doc_url: "{base}/rest/openapi.json"
  spec: IXServicePortIF/checkoutSord
  notes:
    en: >
      objId accepts an int id or "(GUID)". checkoutSord returns an EditInfo:
      put sordZ INSIDE editInfoZ and set editInfoZ.bset "1" (mbSord) so the
      response carries result.sord. (A bare top-level sordZ / editInfoZ.bset
      "0" comes back empty - confirmed live.)

    de: 'objId akzeptiert eine int-ID oder "(GUID)". checkoutSord liefert ein EditInfo: sordZ gehört IN editInfoZ, und editInfoZ.bset "1" (mbSord) sorgt dafür, dass die Antwort result.sord enthält. (Ein bloßes top-level sordZ bzw. editInfoZ.bset "0" kommt leer zurück - live bestätigt.)'
    es: 'objId acepta un id entero o "(GUID)". checkoutSord devuelve un EditInfo: sordZ va DENTRO de editInfoZ, y editInfoZ.bset "1" (mbSord) hace que la respuesta traiga result.sord. (Un sordZ suelto de nivel superior, o editInfoZ.bset "0", vuelve vacío - confirmado en vivo.)'
result_shape: |
  {
    "sord": {
      "id": 2,
      "guid": "(E10E1000-E100-E100-E100-E10E10E10E00)",
      "name": "Administration",
      "maskName": "Ordner",
      "type": 1
    }
  }

snippets:
  python: |
    from elo_playground import connect

    # --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    ELO_BASE_URL = "http://localhost:9090/ix-Repository1"
    ELO_USER = "Administrator"
    ELO_PASS = "elo"

    elo = connect(base_url=ELO_BASE_URL, user=ELO_USER, password=ELO_PASS)

    # objId can be an int id OR a "(GUID)" copied from the ELO client.
    # 2 is a real folder on a stock repository, so this runs anywhere.
    obj_id = 2   # e.g. "(4A5B6C7D-8E9F-0A1B-2C3D-4E5F60718293)"

    res = elo.call("checkoutSord", {
        "objId": obj_id,
        # checkoutSord answers with an EditInfo; sordZ goes INSIDE editInfoZ,
        # and editInfoZ.bset "1" (mbSord) makes it fill in result.sord.
        "editInfoZ": {"bset": "1", "sordZ": {"bset": "449304431574384639"}},
    })
    sord = res["sord"]

    # ELO type: 254..998 = document, below that = folder/structure
    # (special containers like the repo root use 9999).
    kind = "document" if 254 <= int(sord.get("type", 0)) < 999 else "folder"
    print(f"{kind}: {sord['name']}  (id {sord['id']}, mask: {sord.get('maskName')})")

  node: |
    import { connect } from "elo-playground";

    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = "http://localhost:9090/ix-Repository1";
    const ELO_USER = "Administrator";
    const ELO_PASS = "elo";

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });

    // objId can be an int id OR a "(GUID)" copied from the ELO client.
    // 2 is a real folder on a stock repository, so this runs anywhere.
    const objId = 2; // e.g. "(4A5B6C7D-8E9F-0A1B-2C3D-4E5F60718293)"

    const res = await elo.call("checkoutSord", {
      objId,
      // checkoutSord answers with an EditInfo; sordZ goes INSIDE editInfoZ,
      // and editInfoZ.bset "1" (mbSord) makes it fill in result.sord.
      editInfoZ: { bset: "1", sordZ: { bset: "449304431574384639" } },
    });
    const sord = res.sord;

    // ELO type: 254..998 = document, below = folder (repo root uses 9999).
    const t = Number(sord.type || 0);
    const kind = t >= 254 && t < 999 ? "document" : "folder";
    console.log(`${kind}: ${sord.name}  (id ${sord.id}, mask: ${sord.maskName})`);

  browser: |
    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = "http://localhost:9090/ix-Repository1";
    const ELO_USER = "Administrator";
    const ELO_PASS = "elo";

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });
    const objId = 2; // an int id or a "(GUID)" from the ELO client

    const res = await elo.call("checkoutSord", {
      objId,
      editInfoZ: { bset: "1", sordZ: { bset: "449304431574384639" } },
    });
    const sord = res.sord;
    const t = Number(sord.type || 0);
    console.log((t >= 254 && t < 999 ? "document: " : "folder: ") + sord.name + " (id " + sord.id + ")");

