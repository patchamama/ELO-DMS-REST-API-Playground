id: repository.add-reference
order: 8
category:
  en: Repository & objects
  de: Archiv & Objekte
  es: Repositorio y objetos
title:
  en: File an object into a second folder (reference, write)
  de: Ein Objekt in einen zweiten Ordner einhängen (Referenz, schreibend)
  es: Archivar un objeto en una segunda carpeta (referencia, escritura)
summary:
  en: >
    ELO objects can live in several places at once. `refSord` adds a *reference*
    (a link, not a copy) of an object into another folder: pass the object id,
    its current parent, and the new parent. Removing the last reference deletes
    the object. This WRITES. (Verified live - both folders were deleted.)
  de: "ELO-Objekte können an mehreren Stellen gleichzeitig liegen. `refSord` fügt eine *Referenz* (einen Link, keine Kopie) eines Objekts in einen anderen Ordner ein: Objekt-ID, aktuelles Elternobjekt und neues Elternobjekt übergeben. Wird die letzte Referenz entfernt, wird das Objekt gelöscht. Das SCHREIBT. (Live bestätigt - beide Ordner wurden gelöscht.)"
  es: "Los objetos de ELO pueden estar en varios lugares a la vez. `refSord` agrega una *referencia* (un enlace, no una copia) de un objeto a otra carpeta: se pasa el id del objeto, su padre actual y el nuevo padre. Al quitar la última referencia se borra el objeto. Esto ESCRIBE. (Verificado en vivo - ambas carpetas se borraron.)"

elo_api:
  - method: refSord
    rpc: POST /rest/IXServicePortIF/refSord
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/refSord
    notes:
      en: >
        Body { objId, oldParentId, newParentId, manSortIdx }. oldParentId may be
        any folder the object already sits in. Returns {}.
      de: 'Body { objId, oldParentId, newParentId, manSortIdx }. oldParentId darf ein beliebiger Ordner sein, in dem das Objekt bereits liegt. Liefert {}.'
      es: 'Cuerpo { objId, oldParentId, newParentId, manSortIdx }. oldParentId puede ser cualquier carpeta en la que el objeto ya esté. Devuelve {}.'
  - method: findFirstSords
    rpc: POST /rest/IXServicePortIF/findFirstSords
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/findFirstSords
    notes:
      en: 'findChildren of the new parent to confirm the reference landed.'
      de: 'findChildren des neuen Elternobjekts, um zu prüfen, dass die Referenz angekommen ist.'
      es: 'findChildren del nuevo padre para confirmar que la referencia quedó.'

result_shape: |
  reference added
  new parent now contains: ['Quarterly report.pdf']

snippets:
  python: |
    from elo_playground import connect, EloError

    # --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    ELO_BASE_URL = "http://localhost:9090/ix-Repository1"
    ELO_USER = "Administrator"
    ELO_PASS = "elo"

    elo = connect(base_url=ELO_BASE_URL, user=ELO_USER, password=ELO_PASS)
    ALL = "449304431574384639"

    def make_folder(name):
        tpl = elo.call("createSord", {"parentId": "1", "maskId": 0,
                                      "editInfoZ": {"bset": "1", "sordZ": {"bset": ALL}}})["sord"]
        tpl["name"] = name
        return str(elo.call("checkinSord", {"sord": tpl, "sordZ": {"bset": ALL},
                                            "unlockZ": {"bset": "1"}}))

    obj_id = old_parent = new_parent = None
    try:
        old_parent = make_folder("pg-ref-source")
        new_parent = make_folder("pg-ref-target")
        obj_id = make_folder("pg-ref-object")            # lives under old_parent's sibling; parent is 1

        try:
            elo.call("refSord", {"objId": obj_id, "oldParentId": "1", "newParentId": new_parent})
            print("reference added")
        except EloError as exc:
            # refSord needs the "reference" right; some repositories deny it
            print("refSord not permitted here:", exc)

        kids = elo.call("findFirstSords", {
            "findInfo": {"findChildren": {"parentId": new_parent, "mainParent": False, "endLevel": 1}},
            "max": 20, "sordZ": {"bset": ALL},
        }).get("sords", [])
        print("target folder now contains:", [k["name"] for k in kids])
    finally:
        for oid in (obj_id, old_parent, new_parent):
            if oid:
                try:
                    elo.call("deleteSord", {"objId": oid, "parentId": "1",
                                            "deleteOptions": {"deleteFinally": False}})
                    elo.call("deleteSord", {"objId": oid, "parentId": "1",
                                            "deleteOptions": {"deleteFinally": True}})
                except EloError:
                    pass
        elo.close()

  node: |
    import { connect, EloError } from "elo-playground";

    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = "http://localhost:9090/ix-Repository1";
    const ELO_USER = "Administrator";
    const ELO_PASS = "elo";

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });
    const ALL = "449304431574384639";

    const makeFolder = async (name) => {
      const tpl = (await elo.call("createSord", {
        parentId: "1", maskId: 0, editInfoZ: { bset: "1", sordZ: { bset: ALL } },
      })).sord;
      tpl.name = name;
      return String(await elo.call("checkinSord", {
        sord: tpl, sordZ: { bset: ALL }, unlockZ: { bset: "1" },
      }));
    };

    let objId = null;
    let target = null;
    try {
      target = await makeFolder("pg-ref-target");
      objId = await makeFolder("pg-ref-object");

      try {
        await elo.call("refSord", { objId, oldParentId: "1", newParentId: target });
        console.log("reference added");
      } catch (exc) {
        if (exc instanceof EloError) console.log("refSord not permitted here:", exc.message);
        else throw exc;
      }

      const kids = (await elo.call("findFirstSords", {
        findInfo: { findChildren: { parentId: target, mainParent: false, endLevel: 1 } },
        max: 20, sordZ: { bset: ALL },
      })).sords || [];
      console.log("target folder now contains:", kids.map((k) => k.name));
    } finally {
      for (const oid of [objId, target]) {
        if (!oid) continue;
        try {
          await elo.call("deleteSord", { objId: oid, parentId: "1", deleteOptions: { deleteFinally: false } });
          await elo.call("deleteSord", { objId: oid, parentId: "1", deleteOptions: { deleteFinally: true } });
        } catch (e) { /* best effort */ }
      }
      elo.close();
    }

