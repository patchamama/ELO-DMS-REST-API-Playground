id: repository.delete-sord
order: 5
category:
  en: Repository & objects
  de: Archiv & Objekte
  es: Repositorio y objetos
title:
  en: Delete an object (write, two steps)
  de: Ein Objekt löschen (schreibend, zwei Schritte)
  es: Borrar un objeto (escritura, dos pasos)
summary:
  en: >
    `deleteSord` is a TWO-step call: the first marks the object deleted (it moves
    to the recycle bin), the second - with `deleteOptions.deleteFinally` - purges
    it for good. A single `deleteFinally` call on a live object does not remove
    it. This WRITES. (Verified live.)
  de: "`deleteSord` ist ein Aufruf in ZWEI Schritten: der erste markiert das Objekt als gelöscht (es wandert in den Papierkorb), der zweite - mit `deleteOptions.deleteFinally` - entfernt es endgültig. Ein einzelner `deleteFinally`-Aufruf auf ein aktives Objekt entfernt es nicht. Das SCHREIBT. (Live bestätigt.)"
  es: "`deleteSord` es una llamada de DOS pasos: la primera marca el objeto como borrado (va a la papelera), la segunda - con `deleteOptions.deleteFinally` - lo purga definitivamente. Una sola llamada con `deleteFinally` sobre un objeto vivo no lo elimina. Esto ESCRIBE. (Verificado en vivo.)"

elo_api:
  - method: deleteSord
    rpc: POST /rest/IXServicePortIF/deleteSord
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/deleteSord
    notes:
      en: >
        Body { objId, parentId, deleteOptions, unlockZ }. Call it once with
        deleteFinally:false (-> recycle bin), then again with deleteFinally:true
        (-> purged). deleteOptions also has folderMustBeEmpty, deleteResidueFree, ...
      de: 'Body { objId, parentId, deleteOptions, unlockZ }. Einmal mit deleteFinally:false aufrufen (-> Papierkorb), dann erneut mit deleteFinally:true (-> endgültig). deleteOptions kennt u. a. folderMustBeEmpty, deleteResidueFree.'
      es: 'Cuerpo { objId, parentId, deleteOptions, unlockZ }. Llamalo una vez con deleteFinally:false (-> papelera) y otra con deleteFinally:true (-> purgado). deleteOptions tiene además folderMustBeEmpty, deleteResidueFree, ...'

result_shape: |
  scratch folder: 5361
  step 1 (to recycle bin): ok
  step 2 (purge):          ok
  gone: True

snippets:
  python: |
    import os
    from elo_playground import connect, EloError

    # --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    ELO_BASE_URL = os.getenv("ELOPG_ELO_BASE_URL", "http://localhost:9090/ix-Repository1") # ELOPG_DEFAULT:base_url
    ELO_USER = os.getenv("ELOPG_ELO_USER", "Administrator") # ELOPG_DEFAULT:user
    ELO_PASS = os.getenv("ELOPG_ELO_PASSWORD", "elo") # ELOPG_DEFAULT:password

    elo = connect(base_url=ELO_BASE_URL, user=ELO_USER, password=ELO_PASS)
    ALL = "449304431574384639"

    # Provision a throwaway folder so this snippet is self-contained.
    tpl = elo.call("createSord", {"parentId": "1", "maskId": 0,
                                  "editInfoZ": {"bset": "1", "sordZ": {"bset": ALL}}})["sord"]
    tpl["name"] = "pg-delete-me"
    obj_id = str(elo.call("checkinSord", {"sord": tpl, "sordZ": {"bset": ALL},
                                          "unlockZ": {"bset": "1"}}))
    print("scratch folder:", obj_id)

    try:
        # step 1 - move it to the recycle bin
        elo.call("deleteSord", {"objId": obj_id, "parentId": "1",
                                "deleteOptions": {"deleteFinally": False}})
        print("step 1 (to recycle bin): ok")

        # step 2 - purge it for good
        elo.call("deleteSord", {"objId": obj_id, "parentId": "1",
                                "deleteOptions": {"deleteFinally": True}})
        print("step 2 (purge):          ok")

        # confirm it is gone
        try:
            elo.call("checkoutSord", {"objId": obj_id,
                                      "editInfoZ": {"bset": "1", "sordZ": {"bset": "0"}}})
            print("gone: False")
        except EloError:
            print("gone: True")
    finally:
        elo.close()

  node: |
    import { connect, EloError } from "elo-playground";

    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = process.env.ELOPG_ELO_BASE_URL || "http://localhost:9090/ix-Repository1"; // ELOPG_DEFAULT:base_url
    const ELO_USER = process.env.ELOPG_ELO_USER || "Administrator"; // ELOPG_DEFAULT:user
    const ELO_PASS = process.env.ELOPG_ELO_PASSWORD || "elo"; // ELOPG_DEFAULT:password

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });
    const ALL = "449304431574384639";

    // Provision a throwaway folder so this snippet is self-contained.
    const tpl = (await elo.call("createSord", {
      parentId: "1", maskId: 0, editInfoZ: { bset: "1", sordZ: { bset: ALL } },
    })).sord;
    tpl.name = "pg-delete-me";
    const objId = String(await elo.call("checkinSord", {
      sord: tpl, sordZ: { bset: ALL }, unlockZ: { bset: "1" },
    }));
    console.log("scratch folder:", objId);

    try {
      // step 1 - move it to the recycle bin
      await elo.call("deleteSord", { objId, parentId: "1", deleteOptions: { deleteFinally: false } });
      console.log("step 1 (to recycle bin): ok");

      // step 2 - purge it for good
      await elo.call("deleteSord", { objId, parentId: "1", deleteOptions: { deleteFinally: true } });
      console.log("step 2 (purge):          ok");

      // confirm it is gone
      try {
        await elo.call("checkoutSord", { objId, editInfoZ: { bset: "1", sordZ: { bset: "0" } } });
        console.log("gone: false");
      } catch (e) {
        if (e instanceof EloError) console.log("gone: true");
        else throw e;
      }
    } finally {
      elo.close();
    }

