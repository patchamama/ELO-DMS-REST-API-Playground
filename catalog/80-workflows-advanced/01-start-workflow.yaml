id: workflows.start
order: 1
category:
  en: Workflows (advanced)
  de: Workflows (fortgeschritten)
  es: Flujos de trabajo (avanzado)
title:
  en: Start a workflow on an object (write)
  de: Einen Workflow auf einem Objekt starten (schreibend)
  es: Iniciar un flujo de trabajo sobre un objeto (escritura)
summary:
  en: >
    `startWorkFlow` launches an instance of a template (`templFlowId`) on an
    archive object (`objId`) and returns the running-workflow id. Read it back
    with `checkoutWorkFlow`. Pick a `templFlowId` with `workflows.templates`.
    This WRITES - use a scratch object. (Verified live on a throwaway
    folder; the workflow and folder were removed afterwards.)
  de: "`startWorkFlow` startet eine Instanz einer Vorlage (`templFlowId`) auf einem Archivobjekt (`objId`) und liefert die ID des laufenden Workflows. Auslesen mit `checkoutWorkFlow`. Eine `templFlowId` mit `workflows.templates` wählen. Das SCHREIBT – ein Wegwerf-Objekt verwenden. (Live bestätigt an einem Wegwerf-Ordner; Workflow und Ordner wurden danach entfernt.)"
  es: "`startWorkFlow` lanza una instancia de una plantilla (`templFlowId`) sobre un objeto del archivo (`objId`) y devuelve el id del workflow en ejecución. Se lee con `checkoutWorkFlow`. Elegí un `templFlowId` con `workflows.templates`. Esto ESCRIBE – usá un objeto descartable. (Verificado en vivo sobre una carpeta desechable; el workflow y la carpeta se eliminaron después.)"

elo_api:
  - method: startWorkFlow
    rpc: POST /rest/IXServicePortIF/startWorkFlow
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/startWorkFlow
    notes:
      en: >
        Note the capital F. Body { templFlowId, flowName, objId } - NOT
        { flowId, name }. Returns the id of the started instance.
      de: 'Großes F beachten. Body { templFlowId, flowName, objId } - NICHT { flowId, name }. Liefert die ID der gestarteten Instanz.'
      es: 'Ojo con la F mayúscula. Cuerpo { templFlowId, flowName, objId } - NO { flowId, name }. Devuelve el id de la instancia iniciada.'
  - method: checkoutWorkFlow
    rpc: POST /rest/IXServicePortIF/checkoutWorkFlow
    doc_url: "{base}/rest/openapi.json"
    spec: IXServicePortIF/checkoutWorkFlow
    notes:
      en: >
        Body { flowId, typeZ, lockZ, workFlowDiagramZ }. typeZ {bset:"0"} reads
        the RUNNING instance ({bset:"2"} would read it as a template - the
        confusing part). lockZ {bset:"0"} = no lock. There is no getWorkFlowStatus.
      de: 'Body { flowId, typeZ, lockZ, workFlowDiagramZ }. typeZ {bset:"0"} liest die LAUFENDE Instanz ({bset:"2"} würde sie als Vorlage lesen - der verwirrende Teil). lockZ {bset:"0"} = keine Sperre. Ein getWorkFlowStatus gibt es nicht.'
      es: 'Cuerpo { flowId, typeZ, lockZ, workFlowDiagramZ }. typeZ {bset:"0"} lee la instancia EN EJECUCIÓN ({bset:"2"} la leería como plantilla - lo confuso). lockZ {bset:"0"} = sin bloqueo. No existe getWorkFlowStatus.'

result_shape: |
  using template 5 (sol.dev.deploy)
  started workflow id: 3
  workflow: sol.dev.deploy  nodes: ['sol.dev.deploy', 'deploy', 'Finish']

snippets:
  python: |
    import os
    from elo_playground import connect, EloError

    # --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    ELO_BASE_URL = os.getenv("ELOPG_ELO_BASE_URL", "http://localhost:9090/ix-Repository1") # ELOPG_DEFAULT:base_url
    ELO_USER = os.getenv("ELOPG_ELO_USER", "Administrator") # ELOPG_DEFAULT:user
    ELO_PASS = os.getenv("ELOPG_ELO_PASSWORD", "elo") # ELOPG_DEFAULT:password

    elo = connect(base_url=ELO_BASE_URL, user=ELO_USER, password=ELO_PASS)
    ALL = "449304431574384639"

    # provision a throwaway object to run the workflow on
    tpl = elo.call("createSord", {"parentId": "1", "maskId": 0,
                                  "editInfoZ": {"bset": "1", "sordZ": {"bset": ALL}}})["sord"]
    tpl["name"] = "pg-workflow-target"
    obj_id = str(elo.call("checkinSord", {"sord": tpl, "sordZ": {"bset": ALL},
                                          "unlockZ": {"bset": "1"}}))
    flow_id = None
    try:
        # 1) pick a real template (ids are not guaranteed to start at 1)
        tmpls = elo.call("findFirstWorkflows", {
            "findInfo": {"type": {"bset": "2"}, "inclHidden": True},
            "max": 5, "wfDiagramZ": {"bset": "0"},
        }).get("workflows") or []
        if not tmpls:
            print("no workflow templates on this repository - nothing to start")
        else:
            tmpl = tmpls[0]
            print(f"using template {tmpl['id']} ({tmpl['name']})")

            # 2) start it (needs the 'start workflow' right)
            try:
                flow_id = elo.call("startWorkFlow", {
                    "templFlowId": tmpl["id"],
                    "flowName": "playground test workflow",
                    "objId": obj_id,
                })
                print("started workflow id:", flow_id)

                # 3) read the running instance back (there is no getWorkFlowStatus)
                res = elo.call("checkoutWorkFlow", {
                    "flowId": flow_id,
                    "typeZ": {"bset": "0"},          # 0 = running instance (2 = template)
                    "lockZ": {"bset": "0"},
                    "workFlowDiagramZ": {"bset": "1073741823"},
                })
                wf = res.get("workflow", res)
                nodes = [n.get("nodeName") or n.get("name") for n in wf.get("nodes", [])]
                print("workflow:", wf.get("name"), " nodes:", [n for n in nodes if n][:8])
            except EloError as exc:
                print("could not start the workflow:", exc)
    finally:
        # tidy up: cancel + delete the workflow, then the folder
        if flow_id is not None:
            for method in ("terminateWorkFlow", "deleteWorkFlow"):
                try:
                    elo.call(method, {"flowId": flow_id})
                except EloError:
                    pass
        for step in (False, True):
            try:
                elo.call("deleteSord", {"objId": obj_id, "parentId": "1",
                                        "deleteOptions": {"deleteFinally": step}})
            except EloError:
                pass
        elo.close()

  node: |
    import { connect, EloError } from "elo-playground";

    // --- local ELO test box (override with ELOPG_* env vars or a .env) ---
    const ELO_BASE_URL = process.env.ELOPG_ELO_BASE_URL || "http://localhost:9090/ix-Repository1"; // ELOPG_DEFAULT:base_url
    const ELO_USER = process.env.ELOPG_ELO_USER || "Administrator"; // ELOPG_DEFAULT:user
    const ELO_PASS = process.env.ELOPG_ELO_PASSWORD || "elo"; // ELOPG_DEFAULT:password

    const elo = await connect({ baseUrl: ELO_BASE_URL, user: ELO_USER, password: ELO_PASS });
    const ALL = "449304431574384639";

    const tpl = (await elo.call("createSord", {
      parentId: "1", maskId: 0, editInfoZ: { bset: "1", sordZ: { bset: ALL } },
    })).sord;
    tpl.name = "pg-workflow-target";
    const objId = String(await elo.call("checkinSord", {
      sord: tpl, sordZ: { bset: ALL }, unlockZ: { bset: "1" },
    }));

    let flowId = null;
    try {
      // 1) pick a real template (ids are not guaranteed to start at 1)
      const tmpls = (await elo.call("findFirstWorkflows", {
        findInfo: { type: { bset: "2" }, inclHidden: true },
        max: 5, wfDiagramZ: { bset: "0" },
      })).workflows || [];
      if (!tmpls.length) {
        console.log("no workflow templates on this repository - nothing to start");
      } else {
        const tmpl = tmpls[0];
        console.log(`using template ${tmpl.id} (${tmpl.name})`);

        try {
          flowId = await elo.call("startWorkFlow", {
            templFlowId: tmpl.id, flowName: "playground test workflow", objId,
          });
          console.log("started workflow id:", flowId);

          const res = await elo.call("checkoutWorkFlow", {
            flowId,
            typeZ: { bset: "0" }, lockZ: { bset: "0" },
            workFlowDiagramZ: { bset: "1073741823" },
          });
          const wf = res.workflow || res;
          const nodes = (wf.nodes || []).map((n) => n.nodeName || n.name).filter(Boolean);
          console.log("workflow:", wf.name, " nodes:", nodes.slice(0, 8));
        } catch (exc) {
          if (exc instanceof EloError) console.log("could not start the workflow:", exc.message);
          else throw exc;
        }
      }
    } finally {
      if (flowId !== null) {
        for (const m of ["terminateWorkFlow", "deleteWorkFlow"]) {
          try { await elo.call(m, { flowId }); } catch (e) { /* best effort */ }
        }
      }
      for (const step of [false, true]) {
        try {
          await elo.call("deleteSord", { objId, parentId: "1", deleteOptions: { deleteFinally: step } });
        } catch (e) { /* best effort */ }
      }
      elo.close();
    }

