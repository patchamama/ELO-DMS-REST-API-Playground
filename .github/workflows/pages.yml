name: pages

# Build the backend-free static demo and publish it to GitHub Pages.
# `configure-pages` with enablement:true turns Pages on automatically on the
# first run (the workflow has `pages: write`). If your org blocks that, enable
# it once by hand: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # build_static.py records mock output for every runnable language.
      # Provision each runtime explicitly so Pages does not depend on an image's
      # preinstalled toolchain set.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r backend-python/requirements-dev.txt
      - run: npm install
      - run: python scripts/build_static.py
      - name: Verify backend-free mock deployment
        run: |
          test -f dist/api/run-cache.json
          grep -q 'staticMode: true' dist/index.html
          grep -q 'mockDefault: true' dist/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
