name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r backend-python/requirements-dev.txt

      - name: Install Node deps (links the shared client)
        run: npm install

      - name: pytest
        run: python -m pytest backend-python

      - name: node --test
        run: node --test backend-node/test/*.test.mjs

      - name: smoke (offline / mock)
        run: python scripts/smoke.py
